<!doctype html>
<html lang="en-US" data-boot-state="booting">

<head>
  <meta charset="utf-8" />
  <title>Standalone HTML Doc</title>
  <!-- CORE STYLES: CSS, Typography, and Pagination -->
<!-- @asset id="page-styles" kind="css" order="10" -->
  <style id="page-styles">
    :root {
      --sheet-w: 8.5in;
      --sheet-h: 11in;
      --pad: 0.9in;
      --sheet-gap: 26px;

      --content-w: calc(var(--sheet-w) - 2 * var(--pad));
      --content-h: calc(var(--sheet-h) - 2 * var(--pad));
      --pitch: calc(var(--sheet-h) + var(--sheet-gap));
      /* distance from one sheet's top to the next */

      --block-gap: 0.55em;
      /* distance between text blocks */
      --lead: 0.3em;
      --doc-size: 11pt;
      /* additional padding above headers  */

      --zoom: 1;
      /* document zoom: page geometry scales, the chrome does not */
    }

    * {
      box-sizing: border-box;
    }

    /* An asset block is not page furniture.

       A block is found by its id — `script[id="<assetId>"]` in the loader, the markers in
       `build.mjs` — so an asset id can collide with the id a markup asset gives its own root
       (`doc-bar`: the bar's markup root and the bar's script shared one). The UA sheet's
       `script { display: none }` loses to any author rule, including one about a *different*
       element with that id, and the block then paints its source: header comment, whole module,
       and the register() line. Assert the intent here, once, so no stylesheet can make source
       text of a block. */
    script,
    style {
      display: none !important;
    }

    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #e0e0e0;
      color: #1b1f24;
      font: var(--doc-size)/1.5 Charter, "Iowan Old Style", Georgia, serif;
    }

    #viewport {
      flex: auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: auto;
      /* not hidden: a 200% sheet is wider than the window */
    }

    #stage {
      position: relative;
      width: var(--sheet-w);
      margin-inline: auto;
      padding-block: var(--pad);
      zoom: var(--zoom, 1);
      /* the whole feature: pages + text scale, toolbar and backdrop do not */
    }

    #sheets {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .sheet {
      position: absolute;
      left: 0;
      width: var(--sheet-w);
      height: var(--sheet-h);
      background: #fff;
      box-shadow: 0 1px 6px rgba(16, 22, 30, .15);
    }

    .sheet-margin {
      position: absolute;
      font: 500 10.5px/1 system-ui, -apple-system, sans-serif;
      color: #9aa1ab;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      letter-spacing: .01em;
    }

    .sheet-margin[data-slot="head"] {
      top: calc(var(--pad) * .42);
    }

    .sheet-margin[data-slot="folio"] {
      bottom: calc(var(--pad) * .42);
    }

    .sheet[data-side="recto"] .sheet-margin[data-slot="head"],
    .sheet[data-side="recto"] .sheet-margin[data-slot="folio"] {
      right: var(--pad);
    }

    .sheet[data-side="verso"] .sheet-margin[data-slot="head"],
    .sheet[data-side="verso"] .sheet-margin[data-slot="folio"] {
      left: var(--pad);
    }

    .sheet[data-first] .sheet-margin[data-slot="head"] {
      display: none;
    }

    #content {
      position: relative;
      z-index: 1;
      max-width: var(--content-w);
      margin-inline: auto;
      min-height: var(--content-h);
      outline: none;
    }

    #content>* {
      margin: 0;
      padding-block-end: var(--block-gap);
    }

    #content> :is(h1, h2, h3) {
      padding-block-start: var(--lead);
    }

    #content>.page-spacer {
      padding: 0;
      margin: 0;
      user-select: none;
      pointer-events: none;
    }

    /* A continuation fragment is a block container inside its paragraph. `text-indent` is
       inherited, so a document that indents paragraphs would indent the tail's first line too;
       a continuation line is not a first line. `::first-letter` is not inherited, so a rule
       scoped to `#content > *` does not reach the fragment; a theme using a descendant
       selector must exclude `[data-frag]`. */
    #content [data-frag] {
      text-indent: 0;
    }

    /* ===== Figures (images, standalone HTML, media) =====
       A figure is one block in the flow. Its frame has a deterministic
       height before any bytes decode or any iframe loads, so the pagination
       plan never depends on a late image/iframe resize. */
    #content>figure.figure {
      --figure-w: 1;
      --figure-h: .72;
      position: relative;
      display: block;
      width: calc(var(--figure-w) * 100%);
      margin: 0;
      padding: 0 0 var(--block-gap);
      border: 1px solid #d9dde4;
      border-radius: 5px;
      background: #fff;
      overflow: hidden;
      cursor: default;
    }

    #content>figure.figure[data-selected] {
      outline: 2px solid #2f6fed;
      outline-offset: 2px;
    }

    figure.figure .figure-frame {
      position: relative;
      width: 100%;
      min-height: 2.5rem;
      overflow: hidden;
      background: #fff;
    }

    /* Content that runs unsandboxed says so, in every copy of the file. The author confirmed
       it when they added the plugin; a reader gets no prompt, so this is the only signal. */
    figure.figure[data-trusted] {
      /* The badge's containing block, on trusted figures only: `position: relative` on every
         figure changes pagination's layout work, which is measurable. */
      position: relative;
    }
    figure.figure[data-trusted]::after {
      content: "runs unsandboxed";
      position: absolute;
      right: 6px;
      bottom: 6px;
      padding: 1px 7px;
      border-radius: 99px;
      background: #fdf6ea;
      border: 1px solid #e3c9a6;
      color: #8a5a12;
      font: 10.5px/1.6 system-ui, -apple-system, sans-serif;
      pointer-events: none;
    }
    /* A figure whose plugin is not available keeps its place and its specification.
       The frame says why, and clicking retries; nothing is removed. */
    figure.figure .figure-plugin {
      display: grid;
      place-items: center;
      height: 100%;
      padding: 14px;
      text-align: center;
      font: 12px/1.45 system-ui, -apple-system, sans-serif;
      color: #5b6270;
    }
    figure.figure .figure-plugin[data-state="loading"] {
      background: repeating-linear-gradient(135deg, #fafbfc, #fafbfc 6px, #f4f6f8 6px, #f4f6f8 12px);
    }
    figure.figure .figure-plugin[data-state="failed"] {
      color: #8a5a12;
      background: #fdf8ee;
      border: 1px dashed #e3c9a6;
      box-sizing: border-box;
      cursor: pointer;
    }
    figure.figure .figure-plugin[data-state="failed"]:hover { background: #fbf2df; }

    /* HTML islands: independent width and height fractions of the text area.
       The embedded document scrolls inside if it needs more room. */
    figure.figure[data-kind="html"] .figure-frame {
      width: 100%;
      height: calc(var(--content-h) * var(--figure-h, .72));
      margin-inline: 0;
    }

    /* Raster/SVG images: width is the scaled content width; aspect-ratio
       reserves the correct height before decode. When data-h is explicit,
       the frame becomes a fixed window and object-fit: contain letterboxes
       the image inside it. */
    figure.figure[data-kind="image"] .figure-frame {
      width: 100%;
      aspect-ratio: var(--figure-aspect, 16 / 9);
      max-height: calc(var(--content-h) * .92);
      margin-inline: 0;
      padding: 8px;
      box-sizing: border-box;
    }

    figure.figure[data-kind="image"][data-h]:not([data-h="auto"]) .figure-frame {
      height: calc(var(--content-h) * var(--figure-h, .72));
      aspect-ratio: auto;
      max-height: calc(var(--content-h) * var(--figure-h, .72));
    }

    figure.figure[data-kind="image"] img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Video gets the same page-height contract as an HTML island. */
    figure.figure[data-kind="media"][data-media="video"] .figure-frame {
      width: 100%;
      height: calc(var(--content-h) * var(--figure-h, .6));
      margin-inline: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
    }

    figure.figure[data-kind="media"][data-media="video"] video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    figure.figure[data-kind="media"][data-media="audio"] .figure-frame {
      width: 100%;
      margin-inline: 0;
      padding: 18px 14px;
      background: #f7f8fa;
    }

    figure.figure[data-kind="media"][data-media="audio"] audio {
      display: block;
      width: 100%;
    }

    figure.figure iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    figure.figure figcaption {
      padding: 6px 10px 7px;
      border-top: 1px solid #e8eaef;
      background: #fff;
      font: 500 9.5pt/1.35 system-ui, -apple-system, sans-serif;
      color: #555c66;
      outline: none;
    }

    figure.figure figcaption:empty::before {
      content: "Add a caption";
      color: #a8adb6;
      font-weight: 400;
    }

    figure.figure figcaption:focus {
      background: #fffdf3;
    }

    figure.figure[data-missing] .figure-frame::after {
      content: "Figure source is missing from #figure-store";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: #b3261e;
      font: 500 11px/1.4 system-ui, sans-serif;
      text-align: center;
    }

    #content.is-drop-target {
      outline: 3px dashed #2f6fed;
      outline-offset: 8px;
    }

    /* Floating controls for the selected figure. Lives in app chrome, never
       in the document; serialize() removes it from the clone. */
    #figure-tools {
      position: fixed;
      z-index: 70;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border: 1px solid #d9dde4;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 6px 22px rgba(16, 22, 30, .18);
      font: 500 11px/1 system-ui, -apple-system, sans-serif;
    }

    #figure-tools[hidden] {
      display: none;
    }

    #figure-tools button {
      min-width: 26px;
      height: 26px;
      padding: 0 7px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #31363d;
      font: inherit;
      cursor: pointer;
    }

    #figure-tools button:hover {
      background: #eef1f6;
    }

    #figure-tools .figure-dim {
      display: flex;
      align-items: center;
      gap: 1px;
      padding: 0 2px;
    }

    #figure-tools .figure-dim-label {
      padding: 0 3px;
      color: #8a919b;
      font-size: 10px;
      letter-spacing: .04em;
    }

    #figure-tools .figure-dim-value {
      min-width: 38px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: #5b626c;
    }

    #figure-tools [data-figure-remove] {
      color: #b3261e;
    }

    #probe {
      position: absolute;
      top: 0;
      left: -99999px;
      width: 1px;
      visibility: hidden;
      pointer-events: none;
    }

    #probe>* {
      display: block;
    }

    #probe-content-h {
      height: var(--content-h);
    }

    #probe-pitch {
      height: var(--pitch);
    }

    #probe-pad {
      height: var(--pad);
    }

    /* A document whose settings say `toolbar: false` opens without chrome. The markup
       stays (it is the cheapest thing to keep in sync); this hides it before first
       paint, because the loader sets the attribute before any module is built. */
    html[data-toolbar="off"] #app-toolbar { display: none; }
  </style>
<!-- /@asset -->
<!-- @asset id="boot-ui-styles" kind="css" order="25" -->
  <style id="boot-ui-styles">
    /* Boot shell styles. Self-contained on purpose: this file must render before
       any other asset exists, so it may not rely on core.css or its variables. */

    /* Nothing behind the dialog until boot says so: this is what stops the markup and
       the SVG sprite from painting before the stylesheets have arrived. `visibility`
       keeps layout, so revealing the app later does not reflow. */
    html[data-boot-state="booting"],
    html[data-boot-state="failed"] {
      background: #e0e0e0;
    }
    html[data-boot-state="booting"] body > :not(script):not(style):not(link):not(#boot-dialog),
    html[data-boot-state="failed"] body > :not(script):not(style):not(link):not(#boot-dialog) {
      visibility: hidden;
    }

    #boot-dialog {
      --boot-ink: #1b1f24;
      --boot-muted: #6b7280;
      --boot-line: #dfe1e6;
      --boot-paper: #fff;
      --boot-chrome: #fbfbfc;
      --boot-accent: #2f6fed;
      --boot-danger: #b3261e;
      --boot-danger-soft: rgba(179, 38, 30, .08);
      --boot-ok: #1a7f47;

      width: min(520px, calc(100vw - 32px));
      padding: 0;
      border: 1px solid var(--boot-line);
      border-radius: 10px;
      background: var(--boot-paper);
      color: var(--boot-ink);
      box-shadow: 0 12px 32px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .06);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    #boot-dialog::backdrop { background: rgba(16, 24, 40, .28); }
    /* The dialog is a container, not a control: a focus ring around the whole card is
       noise. Focus is moved to Retry (or the first button) on failure. */
    #boot-dialog:focus,
    #boot-dialog:focus-visible { outline: none; }

    #boot-dialog .boot-head { display: flex; gap: 10px; align-items: flex-start; padding: 16px 18px 12px; }
    #boot-dialog .boot-mark {
      width: 22px; height: 22px; flex: 0 0 auto; margin-top: 1px; border-radius: 6px;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
      background: var(--boot-accent); color: #fff;
    }
    #boot-dialog[data-phase="failed"] .boot-mark { background: var(--boot-danger); }
    #boot-dialog h1 { margin: 0; font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
    #boot-dialog .boot-sub { margin: 2px 0 0; color: var(--boot-muted); font-size: 12.5px; }
    #boot-dialog .boot-body { padding: 0 18px 14px; max-height: 62vh; overflow: auto; }
    #boot-dialog .boot-foot {
      display: flex; gap: 8px; align-items: center; padding: 11px 18px;
      border-top: 1px solid var(--boot-line); background: var(--boot-chrome);
    }
    #boot-dialog .boot-foot .spacer { flex: 1; }

    #boot-dialog button {
      font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 7px; cursor: pointer;
      border: 1px solid var(--boot-line); background: var(--boot-paper); color: var(--boot-ink);
    }
    #boot-dialog button.primary { background: var(--boot-accent); border-color: var(--boot-accent); color: #fff; }
    #boot-dialog button:focus-visible { outline: 2px solid var(--boot-accent); outline-offset: 2px; }

    /* Invariant 16, stated once: an element-selector display outranks the UA sheet's
       `[hidden] { display: none }`, so the intent is written down here rather than repeated on
       every component that can be hidden. */
    #boot-dialog [hidden] { display: none; }

    #boot-dialog .boot-bar {
      height: 5px; border-radius: 99px; background: #eceef2; overflow: hidden; margin: 2px 0 12px;
    }
    #boot-dialog .boot-fill {
      display: block; height: 100%; background: var(--boot-accent);
      width: 100%; transform: scaleX(0); transform-origin: left;
      transition: transform .32s ease-out;
    }

    #boot-dialog .boot-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    #boot-dialog .boot-row {
      display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center;
      font-size: 12.5px; color: var(--boot-muted);
    }
    #boot-dialog .boot-name { color: var(--boot-ink); }
    #boot-dialog .boot-detail { font-size: 11.5px; font-variant-numeric: tabular-nums; }
    #boot-dialog .boot-row[data-state="pending"] { opacity: .5; }
    #boot-dialog .boot-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--boot-line); justify-self: center; }
    #boot-dialog .boot-row[data-state="active"] .boot-name { color: var(--boot-accent); }
    #boot-dialog .boot-row[data-state="active"] .boot-dot { background: var(--boot-accent); animation: boot-pulse 1s infinite; }
    #boot-dialog .boot-row[data-state="ok"] .boot-dot { background: var(--boot-ok); }
    #boot-dialog .boot-row[data-state="failed"] .boot-dot { background: var(--boot-danger); }
    #boot-dialog .boot-row[data-state="failed"] .boot-name { color: var(--boot-danger); }

    /* The two phases are one list: `fetched` means the bytes are here and verified, `carried`
       means the file already had them. Neither is a module that still has to build. */
    #boot-dialog .boot-row[data-state="fetched"] .boot-dot { background: var(--boot-ok); }
    #boot-dialog .boot-row[data-state="carried"] { opacity: .8; }

    @keyframes boot-pulse { 50% { opacity: .35; } }

    #boot-dialog .boot-error {
      display: grid; grid-template-columns: 18px 1fr; gap: 8px;
      margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--boot-line);
    }
    #boot-dialog .boot-error-icon { color: var(--boot-danger); }
    #boot-dialog .boot-error-title { margin: 0 0 3px; font-size: 13px; font-weight: 650; }
    #boot-dialog .boot-error-body { margin: 0; color: var(--boot-muted); font-size: 12.5px; overflow-wrap: anywhere; }

    /* Recovery: a newer release exists. Deliberately inside the error card — the settings
       sheet is unreachable here, because a failed boot injects no toolbar. */
    #boot-dialog .boot-update {
      margin: 10px 0 0; padding: 10px 12px; border: 1px solid var(--boot-line); border-radius: 8px;
      background: var(--boot-paper); display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    #boot-dialog .boot-update-text { margin: 0; flex: 1 1 220px; font-size: 12.5px; color: var(--boot-ink); }

    #boot-dialog .boot-diag {
      margin: 10px 0 0; max-height: 180px; padding: 9px 11px; border: 1px solid var(--boot-line); border-radius: 7px;
      background: #f7f8fa; color: #3d4450; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px; white-space: pre-wrap; max-height: 220px; overflow: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      #boot-dialog .boot-fill { transition: none; }
      #boot-dialog .boot-dot { animation: none !important; }
    }
  </style>
<!-- /@asset -->

<!-- @asset id="doc-bar-styles" kind="css" order="21" -->
  <style id="doc-bar-styles">
    /* The one bar a copy has: reader chrome in `view`, annotation chrome in `comment`.
       It is the same element in both, because a review copy needs the folio, the save and
       the zoom too — a second `comment-bar` would have been this file copied.
       It mirrors the editor's `#ui-minimal` bar (34px, folio left, title centred, Save
       right) with its own rules: `toolbar-styles.css` is `requiredBy: ["edit"]` and costs
       30.5 KB, which a viewer must not pay for two buttons. The tokens are the editor's
       values, repeated on purpose.

       Every selector is qualified `header#doc-bar`, not `#doc-bar`: an asset id is
       also the id of its block, so the `doc-bar` script element carried the same id as this
       bar's root. `#doc-bar { display: flex }` then matched the script element too, outranked
       the UA sheet, and painted the module's source below the toolbar in index.html and in
       every viewer file. The tag keeps the sheet off the block; `page-styles.css` holds the
       general rule. */

    header#doc-bar {
      --doc-ink: #1b1f24;
      --doc-muted: #6b7280;
      --doc-line: #dfe1e6;
      --doc-paper: #fff;
      --doc-hover: #eef0f4;
      --doc-accent: #2f6fed;

      flex: 0 0 auto;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 10px;

      function on(event, fn) {
        (listeners[event] || (listeners[event] = [])).push(fn);
        return function off() {
          listeners[event] = (listeners[event] || []).filter((other) => other !== fn);
        };
      }

      function emit(event, detail) {
        for (const fn of (listeners[event] || []).slice()) {
          try {
            fn(detail);
          } catch (error) {
            /* A broken observer must not derail boot. */
            console.error(`boot observer for "${event}" failed:`, error);
          }
        }
      }

      function late(id) {
        return function () {
          const module = modules[id];
          if (!module) throw new Error(`"${id}" is not built yet (late edge used during construction, or the asset is disabled)`);
          return module;
        };
      }

      /* Unlike late(), this never throws: the asset may be absent for good — it is
         mode-gated (an editor module in a view-mode document) or disabled. The getter
         is read at call time, so a module built later is still visible. */
      function optional(id) {
        return function () {
          return modules[id];
        };
      }

      function failure(kind, id, message, extra) {
        return Object.assign({ kind, id, message }, extra || {});
      }

      function fail(record) {
        setState("failed");
        errors.push(record);
        emit("failed", { error: record, errors: errors.slice() });
        return false;
      }

      /* The lazy counterpart of fail(): recorded and emitted, but the document stays
         readable. A missing plugin is a missing capability, not a missing file — the
         reader's content is already on screen and must stay there. */
      function record(record) {
        errors.push(record);
        emit("error", { error: record, errors: errors.slice() });
        return record;
      }

      /* ------------------------------------------------------------- host contract */

      /**
       * Offer a capability to plugins. Called by the module that can actually do the
       * work (figures, editor, toolbar), never by a plugin; the returned function
       * withdraws it, which retry() and unload rely on.
       */
      function provide(name, impl) {
        providers[name] = impl;
        return function withdraw() {
          if (providers[name] === impl) delete providers[name];
        };
      }

      function capability(name) {
        if (!providers[name]) {
          throw failure("unavailable", name, "is not provided by this document (no module offers it)");
        }
        return providers[name];
      }

      /* Everything the host hands a plugin is tracked here. A plugin's own deactivate()
         is advisory — nothing can prove it released anything — but this list is not: the
         host withdraws its own menus, styles, panels and listeners on unload regardless. */
      function makeScope() {
        const disposals = [];
        return {
          add(dispose) {
            if (typeof dispose === "function") disposals.push(dispose);
            return dispose;
          },
          dispose() {
            for (const dispose of disposals.splice(0).reverse()) {
              try {
                dispose();
              } catch (error) {
                console.warn("plugin cleanup failed:", error);
              }
            }
          },
        };
      }

      function bump(id) {
        generations[id] = (generations[id] || 0) + 1;
      }

      /** What "unbuilt" means: the modules, and any stylesheet the bundle injected. */
      function unbuild(assets) {
        const ids = new Set(assets.map((asset) => asset.id));
        for (const id of ids) delete modules[id];
        for (const node of [...injected]) {
          if (ids.has(node.dataset && node.dataset.asset)) {
            node.remove();
            injected.splice(injected.indexOf(node), 1);
          }
        }
      }

      /**
       * Text of one of a plugin's own assets.
       *
       * Bytes that arrived by reference are the verified ones. Bytes the file carries are
       * read back out of their block, so "content inline, runtime online" needs no second
       * copy — the content is what the document already has.
       */
      async function assetText(assetId) {
        const asset = assetById(assetId);
        if (!asset) throw failure("missing", assetId, "is not in the manifest");
        if (asset.mode !== "inline") return source(assetId);
        if (asset.kind === "css") {
          const el = document.querySelector(`style[id="${assetId}"]`);
          return el ? el.textContent : "";
        }
        if (asset.kind === "html") {
          const el = inlineElement(assetId);
          return el ? el.innerHTML : "";
        }
        const el = document.querySelector(`script[id="${assetId}"]`);
        /* A block carries the build's provenance comment and its register() line. Neither is
           part of what the plugin *is*, and the by-reference path returns the published body
           without them, so strip them here and the two paths agree. */
        return el ? stripEnvelope(el.textContent) : "";
      }

      function stripEnvelope(text) {
        return String(text || "")
          .replace(/^\s*\/\*@compiled-from[^\n]*\n/, "")
          .replace(/\n?\s*StandaloneDoc\.register\([^\n]*\);\s*$/, "")
          .replace(/^\s*\n/, "")
          .replace(/\s+$/, "");
      }

      /* The element of a block carried by the file, found through its marker: a
         fragment's element does not carry the asset id itself. */
      function inlineElement(assetId) {
        if (typeof document === "undefined") return null;
        const walker = document.createTreeWalker(document.body, 128 /* SHOW_COMMENT */);
        const wanted = new RegExp(`id="${assetId}"`);
        let node;
        while ((node = walker.nextNode())) {
          if (!/^\s*@asset\b/.test(node.nodeValue || "") || !wanted.test(node.nodeValue || "")) continue;
          let sibling = node.nextSibling;
          while (sibling && sibling.nodeType !== 1 /* ELEMENT_NODE */) sibling = sibling.nextSibling;
          return sibling;
        }
        return null;
      }

      /* The host object a plugin's activate() receives. Deliberately small: everything
         here is either data the document already owns or a capability that was actually
         built, so a plugin cannot reach past this document's own configuration. */
      function makeHost(id, entry, assets, scope) {
        const own = new Set(assets.map((asset) => asset.id));
        return {
          api: HOST_API,
          plugin: {
            id,
            label: entry.label || id,
            version: entry.version || null,
            /* The island a contribution's *content* mounts into. Not the plugin's own
               reach: plugin code always runs in this document, like the editor does. */
            island: entry.island || "sealed",
          },
          /** Text of one of its *own* assets; another plugin's bytes are not readable. */
          async text(assetId) {
            if (!own.has(assetId)) throw failure("forbidden", assetId, `is not part of plugin "${id}"`);
            const asset = assetById(assetId);
            if (asset && asset.kind === "bin") {
              throw failure("missing", assetId, "is binary — use host.bytes() for it");
            }
            return assetText(assetId);
          },
          /** Bytes of one of its own assets (wasm, or any other binary it pinned). */
          async bytes(assetId) {
            if (!own.has(assetId)) throw failure("forbidden", assetId, `is not part of plugin "${id}"`);
            return bytesOf(assetId);
          },
          /** A capability this document built (figures, editor, toolbar), or a refusal. */
          use: (name) => capability(name),
          /** Whether it is there at all — the question a plugin should ask first, because
              `use()` on an absent capability fails the plugin, not the feature. */
          can: (name) => Boolean(providers[name]),
          /** Host-owned cleanup: withdraws things even if the plugin never does. */
          track: (dispose) => scope.add(dispose),
          on: (event, fn) => scope.add(on(event, fn)),
          /* A copy: a plugin reading settings is fine, editing the live snapshot is not. */
          settings: () => ({ ...settings() }),
          manifest: () => manifest(),
        };
      }

      /* A document declares the mode it was saved for (edit | view | comment), and an
         asset declares the modes that need it. "*" means all of them, so a view-mode
         document never even fetches the editor. */
      function inMode(asset, mode) {
        const requiredBy = asset.requiredBy || ["*"];
        return requiredBy.includes("*") || requiredBy.includes(mode);
      }

      /* The runtime twin of `policy.allows()` and of the build's filter: a capability the
         document does not declare is `absent`, so `boot()` skips it rather than failing on
         a block it was never supposed to fetch (invariant 28). */
      function allows(asset, capabilities) {
        if (!asset.capability) return true;
        const value = (capabilities || {})[asset.capability];
        return Boolean(value) && value !== "off";
      }

      /* Only constructed modules: infrastructure is already running, and a plugin is
         built by require(), not by boot. */
      function planned() {
        const {mode, capabilities} = settings();
        return manifest()
          .assets.filter((asset) => inMode(asset, mode) && allows(asset, capabilities) && !isPlugin(asset))
          .sort((a, b) => a.order - b.order);
      }

      function order() {
        return planned()
          .filter((asset) => asset.kind === "js" && asset.role !== "infra")
          .map((asset) => asset.id);
      }

      /**
       * A paste-ready report of this document's runtime state.
       *
       * Data, not prose: the boot dialog and the About panel both show it, and neither owns it.
       * `order` is what a boot attempt asked for — the modules, not every asset — because that
       * is what a reader can compare against the rows they saw.
       */
      function diagnostics({ order: modulesOrder = null } = {}) {
        const lines = [
          "standalone-doc boot",
          `state:    ${state}`,
          `document: ${location.href}`,
          `modules:  ${(modulesOrder || Object.keys(modules)).join(", ") || "—"}`,
          "",
        ];
        for (const error of errors) {
          lines.push(`[${error.kind || error.phase}] ${error.id}: ${error.message}`);
          if (error.url) lines.push(`url: ${error.url}`);
          if (error.expected) lines.push(`expected ${error.expected}`, `actual   ${error.actual}`);
          if (error.stack) lines.push(error.stack);
          lines.push("");
        }
        lines.push(`user agent: ${navigator.userAgent}`);
        return lines.join("\n");
      }

      async function sha384(buffer) {
        const digest = await crypto.subtle.digest("SHA-384", buffer);
        let binary = "";
        for (const byte of new Uint8Array(digest)) binary += String.fromCharCode(byte);
        return "sha384-" + btoa(binary);
      }

      /* Bytes from the CDN, verified, not yet evaluated. Split out from fetchAsset so
         the save path can embed exactly what it verified (Phase 4): "verified before
         it runs" and "verified before it is written into a file" are the same rule. */
      async function fetchVerified(asset) {
        if (asset.mode !== "online") {
          throw failure("missing", asset.id, `not loaded, and its mode is "${asset.mode}"`);
        }
        if (!asset.url) throw failure("missing", asset.id, "has no url in the manifest");
        const timeoutMs = settings().timeoutMs || 8000;

        /* Our own timer, not AbortSignal.timeout: engines disagree about the error
           name they produce, and we need to know *we* aborted, not the network. */
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);

        let response;
        try {
          response = await fetch(asset.url, { signal: controller.signal, cache: "force-cache" });
        } catch (error) {
          const timedOut = controller.signal.aborted;
          /* navigator.onLine only *labels* the failure; it never decides anything. */
          const kind = timedOut ? "timeout" : navigator.onLine === false ? "offline" : "unreachable";
          const message = timedOut ? `no response within ${timeoutMs} ms` : (error && error.message) || "fetch failed";
          throw failure(kind, asset.id, message, { url: asset.url });
        } finally {
          clearTimeout(timer);
        }

        if (!response.ok) {
          throw failure("http", asset.id, `HTTP ${response.status}`, { url: asset.url, status: response.status });
        }

        const bytes = await response.arrayBuffer();
        const actual = await sha384(bytes);
        if (asset.integrity && actual !== asset.integrity) {
          throw failure("integrity", asset.id, "hash does not match the manifest", {
            url: asset.url,
            expected: asset.integrity,
            actual,
          });
        }

        /* Both: a module is evaluated from text, a binary asset is handed over as bytes, and
           the hash is over the bytes either way. */
        return { text: new TextDecoder().decode(bytes), bytes };
      }

      /* Evaluate verified bytes. Side effects stay here, never in the fetch, so the
         load phase can run in parallel without reordering anything. */
      async function evaluate(asset, fetched) {
        const text = typeof fetched === "string" ? fetched : fetched.text;
        if (asset.kind === "css") return { css: text };
        if (asset.kind === "html") return { html: text };
        /* A binary asset is bytes handed to whoever asked. It is never evaluated here: the
           runtime that instantiates it belongs to the plugin, not to the loader. */
        if (asset.kind === "bin") return { binary: fetched.bytes || new ArrayBuffer(0) };
        const blob = URL.createObjectURL(new Blob([text], { type: "text/javascript" }));
        let namespace;
        try {
          namespace = await import(blob);
        } catch (error) {
          throw failure("import", asset.id, error && error.message ? error.message : "module failed to evaluate", { url: asset.url });
        }
        /* An asset with no `factory` is a plain ES module — the namespace *is* the
           module. That is how a third-party library (an npm package pinned as a plugin)
           differs from one of ours, without a wrapper. */
        if (!asset.factory) return { namespace };
        const factory = namespace[asset.factory];
        if (typeof factory !== "function") {
          throw failure("import", asset.id, `module does not export ${asset.factory}`, { url: asset.url });
        }
        return { factory };
      }

      async function fetchAsset(asset) {
        if (factories[asset.id]) return { factory: factories[asset.id] };
        if (asset.mode !== "online") {
          throw failure("missing", asset.id, `not loaded, and its mode is "${asset.mode}"`);
        }
        const fetched = await fetchVerified(asset);
        return evaluate(asset, fetched);
      }

      /**
       * Decoded bytes for one asset: the binary sibling of `source(id)`.
       *
       * Inline bytes are base64 in the document (the only text-safe way to carry them);
       * by-reference bytes come from the same verified fetch that a module would. Cached,
       * because a wasm module of any size must not be transferred twice.
       */
      async function bytesOf(id) {
        if (binaries[id] instanceof ArrayBuffer) return binaries[id];
        const asset = assetById(id);
        if (!asset) throw failure("missing", id, "is not in the manifest");
        let bytes;
        if (asset.mode === "inline") {
          const el = document.querySelector(`script[id="${id}"]`);
          if (!el) throw failure("missing", id, "is inline but its block is not in this document");
          const base64 = (el.textContent || "").replace(/\s+/g, "");
          const binary = atob(base64);
          const view = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) view[i] = binary.charCodeAt(i);
          bytes = view.buffer;
        } else {
          const fetched = await fetchVerified(asset);
          bytes = fetched.bytes;
        }
        binaries[id] = bytes;
        return bytes;
      }

      /**
       * Fetch a url and hash it, with nothing to verify against.
       *
       * This is *pinning*, not loading: the author decided the url is the right one, and the
       * hash makes it immutable from then on. `fetchVerified` is the other direction — it
       * refuses bytes that do not match a pin the document already has.
       */
      async function prefetch(url) {
        if (!url) throw failure("missing", url || "(none)", "no url to fetch");
        const timeoutMs = settings().timeoutMs || 8000;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        let response;
        try {
          response = await fetch(url, { signal: controller.signal, mode: "cors", cache: "no-store" });
        } catch (error) {
          const timedOut = controller.signal.aborted;
          const kind = timedOut ? "timeout" : navigator.onLine === false ? "offline" : "unreachable";
          throw failure(kind, url, timedOut ? `no response within ${timeoutMs} ms` : (error && error.message) || "fetch failed");
        } finally {
          clearTimeout(timer);
        }
        if (!response.ok) throw failure("http", url, `HTTP ${response.status}`, { url, status: response.status });
        const bytes = await response.arrayBuffer();
        return { bytes, text: new TextDecoder().decode(bytes), integrity: await sha384(bytes), size: bytes.byteLength };
      }

      /* Verified CDN text for an asset, which is what a saved document embeds when a
         policy decides to inline an asset that was loaded by reference. Cached: the
         bytes at a pinned url + hash cannot change. An inline asset does not need
         this — its text is already the block in the document. */
      async function source(id) {
        if (sources[id] != null) return sources[id];
        const asset = manifest().assets.find((candidate) => candidate.id === id);
        if (!asset) throw failure("missing", id, "is not in the manifest");
        if (asset.mode === "inline") {
          throw failure("missing", id, "is inline, so its text is the block in this document, not a CDN file");
        }
        const fetched = await fetchVerified(asset);
        sources[id] = fetched.text;
        binaries[id] = fetched.bytes;
        return fetched.text;
      }

      /**
       * Put a fetched fragment where its manifest entry says. Chrome goes in front of
       * `#viewport` because the body is a flex column and its position is the layout;
       * a plugin fragment can name its own host with `append:<selector>`.
       */
      function insertFragment(asset, markup) {
        const instruction = asset.insert || "before:#viewport";
        const split = instruction.indexOf(":");
        const place = split < 0 ? "before" : instruction.slice(0, split);
        const selector = split < 0 ? instruction : instruction.slice(split + 1);
        const anchor = document.querySelector(selector);

        /* A fragment is published as its *body*, so the element has to be rebuilt from
           the open tag the manifest carries. That is what keeps a fetched fragment
           identical to the inline one. */
        const open = asset.open || "<div>";
        const tag = (/^<([a-zA-Z][\w-]*)/.exec(open) || [null, "div"])[1];
        const template = document.createElement("template");
        template.innerHTML = `${open}${markup}</${tag}>`;
        const nodes = template.content;
        /* Tag the roots: a fetched fragment is session state, and the save path has to be
           able to tell it from a block that belongs to the file. */
        for (const node of nodes.children) node.setAttribute("data-asset", asset.id);
        if (place === "append" && anchor) anchor.append(nodes);
        else if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(nodes, anchor);
        else document.body.append(nodes);
      }

      /* A stylesheet that arrived by reference. Injected in manifest order so the
         cascade is the same in both flavours. */
      function injectStyle(asset, css) {
        const style = document.createElement("style");
        style.textContent = css;
        style.dataset.asset = asset.id;
        document.head.append(style);
        injected.push(style);
      }

      /**
       * Build exactly one asset.
       *
       * Throws a failure record rather than failing the document: boot() decides that a
       * throw means this file cannot start, while require() decides that only the plugin
       * cannot. The steps are the same either way — a lazy plugin and a boot-time asset
       * must not be able to drift apart.
       */
      async function constructOne(asset, { loaded, index = 0, total = 1, lazy = false } = {}) {
        if (asset.mode === "absent") {
          throw failure("unavailable", asset.id, "is not carried by this document");
        }
        /* Fragments and stylesheets are not modules: an inline one is already in the
           document (that is the point of shipping markup), a fetched one is inserted
           here, before anything that reads it. */
        if (asset.kind === "html") {
          const fetched = loaded?.get(asset.id);
          if (fetched?.html != null) insertFragment(asset, fetched.html);
          return "skipped";
        }
        if (asset.kind === "css") {
          const result = loaded?.get(asset.id);
          if (result?.css != null) injectStyle(asset, result.css);
          return "skipped";
        }
        if (asset.kind === "bin") {
          /* Nothing to construct: decode (inline) or keep (fetched), then hand it over. */
          await bytesOf(asset.id);
          return "skipped";
        }
        if (asset.role === "infra" && asset.kind === "js") return "skipped"; /* already running */

        emit("construct", { id: asset.id, state: "active", index, total, lazy });

        const deps = { env: globalThis, settings: settings(), late, optional };
        for (const name of asset.deps || []) {
          if (!(name in modules)) {
            throw failure("construct", asset.id, `requires "${name}", which is not built`);
          }
          deps[name] = modules[name];
        }

        const result = loaded?.get(asset.id);
        const factory = factories[asset.id] || result?.factory;
        if (!factory && !result?.namespace) {
          throw failure(
            "missing",
            asset.id,
            asset.mode === "inline"
              ? "not loaded (its block is missing from this document)"
              : "not loaded from the CDN",
          );
        }

        try {
          const built = factory ? factory(deps) : result.namespace;
          /* A factory may be async — a plugin that has to await its own template or wasm
             is. Boot's factories are sync, so this only costs a typeof per asset. */
          modules[asset.id] = built && typeof built.then === "function" ? await built : built;
        } catch (error) {
          throw failure("construct", asset.id, error && error.message ? error.message : String(error), {
            stack: error && error.stack ? String(error.stack) : null,
          });
        }

        /* No global is published: the manifest's dependency list is the only way one
           module reaches another, and boot injects it. */
        emit("construct", { id: asset.id, state: "ok", index, total, lazy });
        return "built";
      }

      async function boot() {
        if (state !== "declared") return modules;
        setState("booting");
        errors.length = 0;
        pending.clear();

        /* Plugins are never built here. A document must open when a plugin is missing,
           damaged or switched off, and keeping them out of this list is what keeps boot's
           fail-closed contract about *this document's own* assets. */
        const assets = planned();
        const jsAssets = assets.filter((asset) => asset.kind === "js" && asset.role !== "infra");
        const online = assets.filter((asset) => asset.mode === "online");
        emit("start", {
          order: jsAssets.map((asset) => asset.id),
          assets: assets.map((asset) => asset.id),
          total: jsAssets.length,
          fetched: online.length,
        });

        /* 1. Load in parallel: I/O is order-free. */
        const loaded = new Map();
        const outcomes = await Promise.allSettled(
          online.map(async (asset) => {
            loaded.set(asset.id, await fetchAsset(asset));
          }),
        );
        for (const [i, outcome] of outcomes.entries()) {
          if (outcome.status === "rejected") return fail(outcome.reason);
        }

        /* 2. Construct in order: side effects are order-bound. */
        let index = 0;
        for (const asset of assets) {
          const isModule = asset.kind === "js" && asset.role !== "infra";
          try {
            await constructOne(asset, { loaded, index: isModule ? index : 0, total: jsAssets.length });
          } catch (error) {
            return fail(error);
          }
          if (isModule) index++;
        }

        setState("ready");
        emit("ready", { count: Object.keys(modules).length });
        return modules;
      }

      /**
       * Load and build one plugin, on demand.
       *
       * The document carries the pin (`url` + `integrity` in its own manifest), so this
       * is a verified fetch and a construct — never a lookup by name and never a
       * resolution against a catalog. Concurrent callers share one build; a build plugin
       * returns immediately.
       *
       * A failure is recorded, emitted as "error" and re-thrown to the caller, but the
       * document stays as it was. `unresolved` means this file has no pinned copy;
       * `disabled` means its author switched it off here.
       */
      function requirePlugin(id) {
        if (modules[id]) return Promise.resolve(modules[id]);
        if (pending.has(id)) return pending.get(id);
        const generation = generations[id] || 0;
        const promise = buildPlugin(id, generation)
          .catch((error) => {
            /* One place emits the failure, whatever the reason: the figure that asked
               shows it, and the sheet shows it on the row. */
            emit("plugin", { id, state: "failed", error });
            throw error;
          })
          .finally(() => pending.delete(id));
        /* The caller renders the failure (a figure shows it); this only stops an
           unhandled rejection when the first caller is not listening. */
        promise.catch(() => {});
        pending.set(id, promise);
        return promise;
      }

      async function buildPlugin(id, generation) {
        const entry = plugins()[id];
        if (!entry) throw record(failure("unresolved", id, "this document needs it but has no pinned copy of it"));
        if (entry.enabled === false) throw record(failure("disabled", id, "is turned off in this document"));

        const assets = pluginAssets(entry, id);
        if (!assets.length) throw record(failure("missing", id, "has no assets in this document's manifest"));

        /* Same two phases as boot, for one bundle. Inline assets are already in the
           document and need no fetch. A `bin` is the exception, and it is the whole point of
           the kind: a wasm runtime is fetched by `bytesOf()` when the plugin asks for it, not
           because the plugin was loaded. Without this, exporting Markdown would download a
           typst compiler the target never uses. */
        const online = assets.filter((asset) => asset.mode === "online"
          && asset.kind !== "bin" && !factories[asset.id]);
        const loaded = new Map();
        const outcomes = await Promise.allSettled(
          online.map(async (asset) => {
            loaded.set(asset.id, await fetchAsset(asset));
          }),
        );
        for (const outcome of outcomes) {
          if (outcome.status === "rejected") throw record(outcome.reason);
        }

        /* Unloaded while the bytes were in flight: do not construct and do not activate.
           The same check runs again after activate(), for an unload that lands during it. */
        if ((generations[id] || 0) !== generation) {
          throw record(failure("stale", id, "was unloaded while it was loading"));
        }

        for (const [position, asset] of assets.entries()) {
          /* A binary is never constructed here either: `bytesOf()` is its only fetch, and
             `host.bytes()` its only reader (invariant 13). */
          if (asset.kind === "bin") continue;
          try {
            await constructOne(asset, { loaded, index: position, total: assets.length, lazy: true });
          } catch (error) {
            throw record(error);
          }
        }

        /* The entry asset is what the plugin *is*; everything else it pinned is there to
           support it. Fall back to the last built asset rather than guessing by name. */
        const main = modules[entry.entry] || modules[assets[assets.length - 1].id] || null;

        const api = Number(entry.api ?? HOST_API) || HOST_API;
        if (api > HOST_API) {
          unbuild(assets);
          throw record(failure("api", id, `needs host API ${api}; this document provides ${HOST_API}`));
        }

        /* Two-phase, like boot: bytes, then side effects. activate() is where a plugin
           wires its contributions, and it is allowed to be async. */
        const scope = makeScope();
        let deactivate = null;
        let activation = null;
        if (main && typeof main.activate === "function") {
          try {
            activation = await main.activate(makeHost(id, entry, assets, scope));
            if (activation && typeof activation.deactivate === "function") deactivate = () => activation.deactivate();
          } catch (error) {
            scope.dispose();
            unbuild(assets);
            throw record(
              failure("construct", id, `activate() failed: ${error && error.message ? error.message : String(error)}`, {
                stack: error && error.stack ? String(error.stack) : null,
              }),
            );
          }
        }

        /* Unloaded while it was loading: nothing may survive this build. */
        if ((generations[id] || 0) !== generation) {
          scope.dispose();
          unbuild(assets);
          throw record(failure("stale", id, "was unloaded while it was loading"));
        }

        /* `activation` is kept because the implementations live on it: `insert`, `export`
           and the rest. The registry does not interpret them; the host modules do. */
        live[id] = { id, entry, assets, api, scope, deactivate, activation };
        emit("plugin", { id, label: entry.label || id, state: "ready" });
        return main;
      }

      /**
       * Unload a plugin.
       *
       * Best effort by design: `deactivate()` is a promise the plugin makes and nothing
       * can verify it, so the host withdraws what it handed out (the scope) and removes
       * the built modules either way. Figures already mounted keep running until the
       * file is reopened — that is the honest limit of an unload in a live document.
       */
      async function deactivatePlugin(id) {
        const rec = live[id];
        bump(id); /* first, so a build in flight cannot undo this */
        delete live[id];
        if (!rec) return false;
        try {
          if (rec.deactivate) await rec.deactivate();
        } catch (error) {
          record(
            failure("construct", id, `deactivate() failed: ${error && error.message ? error.message : String(error)}`),
          );
        }
        rec.scope.dispose();
        unbuild(rec.assets);
        emit("plugin", { id, label: rec.entry.label || id, state: "deactivated" });
        return true;
      }

      /**
       * Build another mode into this copy, on request.
       *
       * Not a save: the received file is never written, and the result is a *new* file with
       * no library (`cloud` is the export's business). The copy carries the other mode's
       * *declarations* — `mode: "online"` with `url` + `integrity`, a few kilobytes of JSON
       * and no code — and this is where the code is fetched, verified and built (invariant
       * 34's other half: a sealed copy, whose addresses were deleted, fails here).
       *
       * The upgrade is a document change: `mode` and `capabilities.edit = "off"` land in
       * `#doc-settings`, so the file is dirty before the first keystroke, and a copy of the
       * copy is not an editor (no recursion).
       */
      async function adopt(mode) {
        if (!["edit", "view", "comment"].includes(mode)) {
          throw failure("unavailable", mode, "is not a mode this document can adopt");
        }
        if (state !== "ready") throw failure("construct", mode, "can only adopt from a ready document");
        /* What actually needs work: a module that is not built, or a fetched stylesheet or
           fragment. An inline stylesheet/fragment is already applied — it was parsed with the
           document — so it is not a job for this loop and must not be mistaken for one. */
        const required = manifest().assets
          .filter((asset) => asset.role !== "infra" && !isPlugin(asset) && asset.kind !== "bin")
          .filter((asset) => inMode(asset, mode) && allows(asset, settings().capabilities));
        const wanted = required
          .filter((asset) => (asset.kind === "js" ? !(asset.id in modules) : asset.mode === "online"))
          .sort((a, b) => a.order - b.order);

        /* An `inline` declaration with no block is the one thing this cannot fix: the bytes
           are neither here nor addressable. Say that, rather than booting half an editor. */
        const stranded = wanted.find((asset) => asset.mode !== "online");
        if (stranded) {
          throw failure(
            "missing",
            stranded.id,
            `${stranded.id}: is declared "${stranded.mode}" but this copy does not carry it — only a copy with an editable address can adopt "${mode}"`,
          );
        }

        setState("booting");
        emit("start", {
          order: wanted.filter((asset) => asset.kind === "js").map((asset) => asset.id),
          assets: wanted.map((asset) => asset.id),
          total: wanted.filter((asset) => asset.kind === "js").length,
          fetched: wanted.length,
          /* The rows are the *adopted* plan, not the current mode's: the dialog would
             otherwise list what this copy already runs. */
          plan: wanted,
        });

        const loaded = new Map();
        try {
          await Promise.all(wanted.map(async (asset) => {
            loaded.set(asset.id, await fetchAsset(asset));
          }));
        } catch (error) {
          setState("ready");
          emit("ready", {count: Object.keys(modules).length});
          throw error;
        }

        let index = 0;
        try {
          for (const asset of wanted) {
            const isModule = asset.kind === "js" && asset.role !== "infra";
            await constructOne(asset, {loaded, index: isModule ? index : 0, total: wanted.length});
            if (isModule) index += 1;
          }
        } catch (error) {
          /* Fail closed for the mode, open for the document: what was built is withdrawn,
             and the copy the reader already had stays readable. */
          unbuild(wanted);
          setState("ready");
          emit("ready", {count: Object.keys(modules).length});
          throw error;
        }

        const block = document.getElementById("doc-settings");
        if (block) {
          try {
            const stored = JSON.parse(block.textContent || "{}");
            stored.mode = mode;
            stored.editable = mode === "edit";
            stored.capabilities = {...(stored.capabilities || {}), edit: "off"};
            block.textContent = JSON.stringify(stored);
          } catch {
            /* A corrupt block: the caller's mode change already happened in memory, and
               the next save is the place to fix the file. */
          }
        }
        modules["apply-settings"]?.apply?.();
        modules.pagination?.schedule?.();
        modules.status?.markDirty?.();
        setState("ready");
        emit("ready", {count: Object.keys(modules).length});
        return {mode, adopted: wanted.map((asset) => asset.id)};
      }

      /* Tear the graph down and build it again. Registered factories survive, so a
         failure that was environmental can be retried without reloading the file. */
      async function retry() {
        if (state === "booting") return modules;
        for (const id of Object.keys(live)) await deactivatePlugin(id);
        for (const id of Object.keys(modules)) delete modules[id];
        for (const node of injected.splice(0)) node.remove();
        for (const id of Object.keys(sources)) delete sources[id];
        for (const id of Object.keys(binaries)) delete binaries[id];
        for (const name of Object.keys(providers)) delete providers[name];
        pending.clear();
        errors.length = 0;
        setState("declared");
        return boot();
      }

      return {
        register,
        on,
        late,
        settings,
        optional,
        source,
        bytes: bytesOf,
        prefetch,
        reloadManifest,
        require: requirePlugin,
        deactivate: deactivatePlugin,
        /** What a plugin's activate() returned, or null when it is not built. */
        instance: (id) => live[id]?.activation || null,
        provide,
        /** Whether this document built a named capability. */
        can: (name) => Boolean(providers[name]),
        hostApi: HOST_API,
        plugins,
        boot,
        adopt,
        retry,
        order,
        planned,
        diagnostics,
        manifest,
        catalogUrl,
        catalog,
        compareUpdate,
        tagOf,
        isNewer,
        release,
        repin,
        modules,
        factories,
        errors,
        get state() {
          return state;
        },
      };
    })();

<!-- @asset id="boot-ui" kind="js" order="6" -->
  <script id="boot-ui">
    /* The boot shell. Owns no state: it subscribes to the registry's events and
       renders them. Loaded before any asset, so it may not depend on core CSS, and
       it resolves the dialog lazily so markup order cannot break it. */
    (function () {
      "use strict";

      const registry = globalThis.StandaloneDoc;
      const SHOW_DELAY = 150; /* a card that flashes for 60ms is worse than none */

      /* Presentation only: registration ids are technical. The name travels in the manifest,
         so a document can rename an asset without touching the boot UI. */
      const label = (id) => {
        const assets = (registry && registry.manifest && registry.manifest().assets) || [];
        const asset = assets.find((candidate) => candidate.id === id);
        return (asset && asset.label) || id.charAt(0).toUpperCase() + id.slice(1);
      };

      let ui = null;
      let showTimer = null;
      let lastStart = {order: [], total: 0};
      /* The plan this boot is executing, and the rows that show it. `plan.fetched`/`built` are
         what the bar is made of: the fetch is the slow half and it used to own no part of it. */
      let plan = {byId: new Map(), byUrl: new Map(), fetched: 0, fetchedDone: 0, modules: 0, built: 0};
      const rows = new Map();
      let timelineFrame = 0;
      const failures = [];
      /* The recovery flow. `offered` is the release this card proposed; `updating` is the tag
         being applied, set before retry() so the "ready" handler knows the boot was a repair
         rather than an ordinary start. */
      let offered = null;
      let updating = null;
      /* An offer can still be in flight when a retry lands; without this the answer to a
         question nobody is asking any more would paint itself onto the new card. */
      let offersAllowed = true;

      function ensure() {
        if (ui) return ui;
        const dialog = document.getElementById("boot-dialog");
        if (!dialog) return null;
        ui = {
          dialog,
          title: dialog.querySelector("[data-boot-title]"),
          sub: dialog.querySelector("[data-boot-sub]"),
          bar: dialog.querySelector("[data-boot-bar]"),
          fill: dialog.querySelector("[data-boot-fill]"),
          rows: dialog.querySelector("[data-boot-rows]"),
          error: dialog.querySelector("[data-boot-error]"),
          errorTitle: dialog.querySelector("[data-boot-error-title]"),
          errorBody: dialog.querySelector("[data-boot-error-body]"),
          diag: dialog.querySelector("[data-boot-diag]"),
          retry: dialog.querySelector("[data-boot-retry]"),
          copy: dialog.querySelector("[data-boot-copy]"),
          toggle: dialog.querySelector("[data-boot-toggle]"),
          update: dialog.querySelector("[data-boot-update]"),
          updateText: dialog.querySelector("[data-boot-update-text]"),
          updateGo: dialog.querySelector("[data-boot-update-go]"),
          continue: dialog.querySelector("[data-boot-continue]"),
        };
        wire(ui);
        return ui;
      }

      function setBar(fraction) {
        const el = ensure();
        if (!el) return;
        el.fill.style.transform = `scaleX(${Math.max(0, Math.min(1, fraction)).toFixed(3)})`;
        const pct = Math.round(fraction * 100);
        el.bar.setAttribute("aria-valuenow", String(pct));
        el.bar.setAttribute("aria-valuetext", el.sub.textContent || `${pct}%`);
      }

      function open() {
        const el = ensure();
        if (!el || el.dialog.open) return;
        el.dialog.showModal();
      }

      function scheduleOpen() {
        clearTimeout(showTimer);
        showTimer = setTimeout(open, SHOW_DELAY);
      }

      function close() {
        clearTimeout(showTimer);
        const el = ensure();
        if (el?.dialog.open) el.dialog.close();
      }

      /* Presentation only, like the label: bytes are the document's, not the wire's. A pin says
         what this file carries, and a brotli figure would be a second truth nobody can check. */
      const sizeOf = (asset) => {
        const bytes = Number(asset.bytes) || 0;
        if (!bytes) return "";
        return bytes < 2048 ? `${bytes} bytes` : `${Math.round(bytes / 1024)} KB`;
      };

      /* One row per asset this document boots, not one per module: `order` is 13 modules, and a
         slim document fetches 19 files — the three slowest are a stylesheet, a fragment and the
         sprite (lab/013). Rows come from the registry's plan, so the list cannot disagree with
         what boot actually does. */
      function renderPlan(assets) {
        const el = ensure();
        if (!el) return;
        el.rows.replaceChildren();
        rows.clear();
        plan = {byId: new Map(), byUrl: new Map(), fetched: 0, fetchedDone: 0, modules: 0, built: 0};
        /* `adopt` builds a mode this copy is not in yet, so it names its own plan; boot
           names none and gets the document's. */
        for (const asset of assets || (registry.planned ? registry.planned() : [])) {
          /* Infrastructure is already running: it is not something to wait for. */
          if (asset.role === "infra") continue;
          plan.byId.set(asset.id, asset);
          if (asset.url) plan.byUrl.set(asset.url, asset);
          const module = asset.kind === "js";
          if (module) plan.modules++;
          const carried = asset.mode !== "online";
          if (!carried) plan.fetched++;

          const row = document.createElement("li");
          row.className = "boot-row";
          row.dataset.id = asset.id;
          /* An inline stylesheet or fragment is *done* the moment it is parsed; an inline
             module is not, and the construct events move it from `carried` to `ok`. */
          row.dataset.state = carried ? "carried" : "pending";
          row.innerHTML = '<span class="boot-dot" aria-hidden="true"></span><span class="boot-name"></span><span class="boot-detail"></span>';
          row.querySelector(".boot-name").textContent = label(asset.id);
          row.querySelector(".boot-detail").textContent = carried
            ? `in this file${sizeOf(asset) ? ` · ${sizeOf(asset)}` : ""}`
            : "waiting for the CDN";
          el.rows.append(row);
          rows.set(asset.id, row);
        }
        paintBar();
        watchFetches();
      }

      /* The fetch owns 0..0.6 of the bar and construction owns 0.6..1. Without that split the
         construct handler's `done/total` would overwrite the fetch progress downwards the moment
         the first module builds. */
      function paintBar() {
        const fetchShare = plan.fetched ? 0.6 * (plan.fetchedDone / plan.fetched) : 0;
        const buildShare = plan.modules ? 0.4 * (plan.built / plan.modules) : 0;
        setBar(Math.min(1, fetchShare + buildShare));
      }

      /**
       * Paint the fetch phase from the browser's own timeline.
       *
       * No registry event is involved, and none is missing: `performance.getEntriesByType` is
       * append-only on completion and carries duration and (with jsDelivr's
       * `timing-allow-origin: *`) sizes. An event would be a second truth for the same fact
       * (lab/013 measured both).
       */
      function watchFetches() {
        cancelAnimationFrame(timelineFrame);
        if (!plan.fetched) return;
        let seen = 0;
        const step = () => {
          const entries = performance.getEntriesByType("resource");
          for (; seen < entries.length; seen++) {
            const entry = entries[seen];
            const asset = plan.byUrl.get(entry.name);
            if (!asset) continue;
            const row = rows.get(asset.id);
            if (!row || row.dataset.state !== "pending") continue;
            row.dataset.state = "fetched";
            const ms = entry.duration ? ` · ${Math.round(entry.duration)} ms` : "";
            row.querySelector(".boot-detail").textContent = `verified · ${sizeOf(asset)}${ms}`;
            plan.fetchedDone++;
          }
          paintBar();
          if (plan.fetchedDone < plan.fetched && registry.state === "booting") {
            timelineFrame = requestAnimationFrame(step);
          }
        };
        timelineFrame = requestAnimationFrame(step);
      }

      function reset() {
        const el = ensure();
        failures.length = 0;
        offered = null;
        offersAllowed = true;
        cancelAnimationFrame(timelineFrame);
        rows.clear();
        if (!el) return;
        el.error.hidden = true;
        el.retry.hidden = true;
        el.toggle.hidden = true;
        el.update.hidden = true;
        el.updateGo.hidden = true;
        el.updateGo.disabled = false;
        el.continue.hidden = true;
        el.diag.hidden = true;
        el.diag.textContent = "";
        el.dialog.dataset.phase = "booting";
        el.title.textContent = "Starting the editor";
        el.sub.textContent = "";
        setBar(0);
      }

      /* One implementation, in the registry, because the About panel shows the same report and
         a second copy is how two diagnostics came to disagree in the first place. */
      const diagnosticsText = () => registry.diagnostics({order: lastStart.order});

      /* One card per failure mode: the copy is the product here. */
      function copyFor(failure) {
        const name = label(failure.id);
        switch (failure.kind) {
          case "offline":
            return { title: "You appear to be offline", body: `${name} could not be downloaded. Reconnect, then retry — nothing has been changed.` };
          case "unreachable":
            return { title: "The CDN is unreachable", body: `${name} could not be downloaded. Your connection is working, so this is usually temporary or a proxy blocking the CDN.` };
          case "http":
            return { title: "An asset is missing from the CDN", body: `${name} returned HTTP ${failure.status}. This document pins one runtime version; that file was not published at it.` };
          case "timeout":
            return { title: "Loading timed out", body: `${name} did not finish downloading in time. Slow connections usually succeed on retry.` };
          case "integrity":
            return { title: "This document's code has been altered", body: `The bytes served for ${name} do not match the hash recorded when this document was saved. It was not run.` };
          case "import":
            return { title: "A module could not start", body: `${name} downloaded but failed to evaluate.` };
          case "missing":
            return { title: "An asset is not loaded", body: `${name}: ${failure.message}` };
          default:
            /* Never lose the actual message: it is the actionable part. */
            return { title: "The editor failed to start", body: `${name} threw while starting: ${failure.message}` };
        }
      }

      function renderFailure(failure) {
        const el = ensure();
        if (!el) return;
        failures.push(failure);
        const copy = copyFor(failure);
        el.dialog.dataset.phase = "failed";
        el.title.textContent = copy.title;
        el.sub.textContent = "Aborted — nothing has been changed on disk";
        /* Mark the row that failed: the registry emits "active" and then aborts, so
           without this the last row would sit on "starting…" forever. */
        const failedRow = rows.get(failure.id) || el.rows.querySelector(`.boot-row[data-id="${failure.id}"]`);
        if (failedRow) {
          failedRow.dataset.state = "failed";
          failedRow.querySelector(".boot-detail").textContent = "failed";
        }
        el.error.hidden = false;
        el.errorTitle.textContent = label(failure.id);
        el.errorBody.textContent = copy.body;
        el.diag.textContent = diagnosticsText();
        el.retry.hidden = false;
        el.toggle.hidden = false;
        el.copy.hidden = false;
        /* Errors are never delayed: the faster they appear, the less it feels hung. */
        clearTimeout(showTimer);
        open();
        el.retry.focus();
        offerUpdate(failure);
      }

      /* ---------------------------------------------------------------- recovery */

      const pinnedTag = () => registry.tagOf();

      /**
       * Offer a newer release when the failure looks like a stale pin.
       *
       * Only `integrity` and `http` qualify: those are the two ways a tag can stop serving what
       * a document pinned. A construct error or a missing module is not a pin problem, and
       * offering a different release would be a guess dressed as a fix.
       *
       * This lives in the failure card and not in Document settings on purpose: a failed boot
       * injects no toolbar, so the sheet is unreachable exactly when it is needed (measured in
       * lab/009).
       */
      async function offerUpdate(failure) {
        const el = ensure();
        if (!el || !["integrity", "http"].includes(failure.kind)) return;
        const {current, latest, newer, date: when} = await registry.compareUpdate();
        /* The card may have moved on while the catalog was in flight. */
        if (!offersAllowed || registry.state !== "failed" || !el.error || el.error.hidden) return;
        if (!current || !newer) return;
        offered = {from: current, to: latest};
        el.updateText.textContent = `${latest}${when ? ` (${when})` : ""} exists; this document pins ${current}. `
          + "Updating rewrites its pin and fetches that release — nothing on disk changes until you save.";
        el.updateGo.textContent = `Update to ${latest}`;
        el.update.hidden = false;
        el.updateGo.hidden = false;
      }

      function updateFailed(el, message) {
        offersAllowed = false;
        if (!el) return;
        el.update.hidden = false;
        el.updateText.textContent = message;
        el.updateGo.hidden = true;
        el.updateGo.disabled = false;
      }

      async function applyUpdate(el) {
        const offer = offered;
        if (!offer) return;
        el.updateGo.disabled = true;
        el.updateGo.textContent = `Fetching ${offer.to}…`;
        let applied = null;
        try {
          const entry = await registry.release(offer.to);
          applied = registry.repin(entry);
        } catch (error) {
          updateFailed(ensure(), `${offer.to} could not be read (${error && error.message ? error.message : String(error)}). Nothing was changed.`);
          return;
        }
        updating = {tag: offer.to, moved: applied.moved.length, from: offer.from};
        reset();
        open();
        try {
          await registry.retry();
        } catch {
          /* retry() records its own failure and re-renders the card. */
        }
        if (registry.state !== "ready") {
          /* Failure is total: put the document's own pin back, and say so. The card keeps the
             failure it just rendered, so the reader still has the real error in front of them. */
          const tag = updating?.tag;
          updating = null;
          applied.restore();
          updateFailed(ensure(), `${tag} did not load either. This document's own pin was restored; nothing was changed on disk.`);
        }
      }

      function renderRepaired(el) {
        const done = updating;
        updating = null;
        if (!el || !done) return;
        const canSave = !!document.querySelector("[data-save]");
        el.dialog.dataset.phase = "ready";
        el.title.textContent = `Updated to ${done.tag}`;
        el.sub.textContent = `${done.moved} fetched asset${done.moved === 1 ? "" : "s"} re-pinned from ${done.from}`;
        el.error.hidden = true;
        el.errorBody.textContent = "";
        el.retry.hidden = true;
        el.toggle.hidden = true;
        el.copy.hidden = true;
        el.update.hidden = true;
        el.updateGo.hidden = true;
        el.continue.hidden = false;
        /* The repair is in memory. A viewer has no save button, and saying "save the file" to
           a document that cannot write itself would be a lie (lab/009, finding 3). */
        el.update.hidden = false;
        el.updateText.textContent = canSave
          ? "Save the file to keep this update. Until you do, the repaired pin lives in this tab only."
          : "This document is read-only, so the update lasts for this session only.";
        el.updateGo.hidden = true;
        clearTimeout(showTimer);
        open();
        el.continue.focus();
      }

      function wire(el) {
        el.dialog.addEventListener("cancel", (event) => event.preventDefault());

        el.retry.addEventListener("click", () => {
          reset();
          open();
          try {
            registry.retry();
          } catch {
            /* retry() re-emits "failed", which renders the card again. */
          }
        });

        el.updateGo.addEventListener("click", () => {
          applyUpdate(el);
        });

        el.continue.addEventListener("click", () => {
          reset();
          close();
        });

        el.toggle.addEventListener("click", () => {
          const opening = el.diag.hidden;
          el.diag.hidden = !opening;
          el.toggle.textContent = opening ? "Hide diagnostics" : "Diagnostics";
        });

        el.copy.addEventListener("click", async () => {
          const text = diagnosticsText();
          try {
            await navigator.clipboard.writeText(text);
            el.copy.textContent = "Copied";
          } catch {
            el.diag.hidden = false;
            el.diag.textContent = text;
            el.copy.textContent = "Select and copy";
          }
          setTimeout(() => (el.copy.textContent = "Copy diagnostics"), 1400);
        });
      }

      /* Never leave the document hidden forever: if boot never settles (a broken
         registry block, a parse error), reveal it and say so. */
      setTimeout(() => {
        if (document.documentElement.dataset.bootState !== "booting") return;
        document.documentElement.dataset.bootState = "failed";
        const el = ensure();
        if (!el) return;
        el.dialog.dataset.phase = "failed";
        el.title.textContent = "The editor did not start";
        el.sub.textContent = "Nothing has been changed on disk";
        el.error.hidden = false;
        el.errorTitle.textContent = "Boot never finished";
        el.errorBody.textContent = "The runtime did not report ready or failed. Copy the diagnostics and send them to the author.";
        el.retry.hidden = false;
        el.toggle.hidden = false;
        el.copy.hidden = false;
        el.diag.textContent = diagnosticsText();
        open();
      }, 20_000);
