       * previous one ended, and its top is that line's top.
       */
      function planSplit(block, room, minLines = 2, start = 0) {
        const box = layout.rect(block);
        const all = lineBoxes(block);
        if (!all.length) return null;
        const segmentTop = start > 0 ? lineTopAt(block, start + 1) : box.top;
        const first = start > 0
          ? all.findIndex((line) => Math.abs(line.top - segmentTop) < 1)
          : 0;
        if (first < 0) return null;
        const lines = all.slice(first);
        const cut = chooseCut({
          text: block.textContent,
          lines,
          blockTop: segmentTop,
          room,
          lineTopAt: (offset) => lineTopAt(block, offset),
          lineBottomAt: (offset) => lineBottomAt(block, offset),
          minLines,
          start,
        });
        if (!cut) return null;
        if (anchoredAt(block, cut.offset)) return null;
        return {...cut, room, blockTop: segmentTop, blockHeight: box.height, start};
      }

      /**
       * Cut the block at `offset` and group everything after it into a block-level span.
       * `Range.extractContents()` is used rather than node shuffling so nested inline markup
       * (a link, an `<em>`) survives the move.
       */
      function splitBlock(block, offset) {
        const point = pointAt(block, offset);
        const range = document.createRange();
        range.setStart(point.node, point.offset);
        range.setEnd(block, block.childNodes.length);
        const frag = document.createElement("span");
        frag.setAttribute("data-frag", String(offset));
        frag.style.display = "block";
        frag.append(range.extractContents());
        block.append(frag);
        return frag;
      }

      /** Remember the semantic shape each fragmented block was planned against. Called after
          the fragments are applied, so a later pass can tell a shrink (delete) from a no-op. */
      function recordPlanned(p = null) {
        for (const el of [...planned.keys()]) {
          if (!el.isConnected || !el.querySelector("[data-frag]")) planned.delete(el);
        }
        if (!fragmenting) return;
        /* A fresh cut measured the block's line height; a reused cut keeps the previous one
           (re-measuring it per pass is the expensive half of the no-churn path). */
        const fresh = new Map();
        for (const split of p?.splits || []) {
          if (split.plan && !split.plan.reused && split.plan.lineHeight) fresh.set(split.block, split.plan.lineHeight);
        }
        for (const el of content.children) {
          if (!el.querySelector("[data-frag]")) continue;
          planned.set(el, {
            height: semanticH(el),
            text: el.textContent.length,
            lineHeight: fresh.get(el) ?? planned.get(el)?.lineHeight ?? 18,
          });
        }
      }

      /** Undo every split: measurement must always see the semantic document. */
      function mergeFragments() {
        const frags = [...content.querySelectorAll("[data-frag]")];
        for (const frag of frags) {
          const parent = frag.parentNode;
          if (!parent) continue;
          while (frag.firstChild) parent.insertBefore(frag.firstChild, frag);
          frag.remove();
          /* Adjacent text nodes are re-merged here, not only at the top level: a fragment can
             sit inside a nested block after an edit, and a half-normalised parent makes the
             next `pointAt()` produce a different cut. */
          parent.normalize();
        }
        return frags.length;
      }

      /**
       * Realise a plan's splits: each tail must start at its next page's content top.
       * Returns the measured pushes so a report can show what happened.
       */
      function applyFragments(splits) {
        const applied = [];
        /* One group per block, in plan order; a block can now need several cuts. */
        const groups = [];
        for (const split of splits) {
          const last = groups[groups.length - 1];
          if (last && last.block === split.block) last.splits.push(split);
          else groups.push({block: split.block, splits: [split]});
        }

        for (const group of groups) {
          const cuts = group.splits;
          let spans;
          if (cuts.every((cut) => cut.existing)) {
            spans = cuts.map((cut) => cut.existing);
          } else {
            if (cuts.some((cut) => cut.existing)) mergeBlock(group.block);
            const first = splitBlock(group.block, cuts[0].offset);
            spans = [first];
            let previous = cuts[0].offset;
            let tail = first;
            for (let k = 1; k < cuts.length; k++) {
              /* Split the remaining tail again, then lift the new span out to be a sibling:
                 nested block spans would make the pages' margins compound. */
              const next = splitBlock(tail, cuts[k].offset - previous);
              tail.after(next);
              next.dataset.frag = String(cuts[k].offset);
              spans.push(next);
              previous = cuts[k].offset;
              tail = next;
            }
          }

          cuts.forEach((split, k) => {
            const frag = spans[k];
            if (Number(frag.dataset.frag) !== split.offset) frag.dataset.frag = String(split.offset);
            /* A reused fragment is already pushed; the target is measured from its unpushed top,
               or a no-op pass would read the push as part of the layout and erase it. */
            const fragTop = layout.rect(frag).top;
            const currentPush = inlineMargin(frag);
            const push = Math.max(0, layoutPx(split.targetTop - (fragTop - currentPush)));
            if (Math.abs(currentPush - push) > 0.5) frag.style.marginBlockStart = `${push}px`;
            applied.push({
              block: split.block,
              offset: split.offset,
              push,
              targetTop: split.targetTop,
              reused: Boolean(split.existing),
              fragTopBefore: Math.round(fragTop),
              fragTopAfter: Math.round(layout.rect(frag).top),
              plan: split.plan ?? null,
              blockTopAtApply: Math.round(layout.rect(split.block).top),
              blockMargin: split.block.style.marginBlockStart || "",
              blockIsPageStart: split.block.hasAttribute("data-page-start"),
            });
          });
        }
        return applied;
      }

      const fragmentCount = () => content.querySelectorAll("[data-frag]").length;

      const inlineMargin = (el) => parseFloat(el.style.marginBlockStart || "0") || 0;

      /* Layout units are 1/64 px in the engines that snap. Writing a value on that grid keeps
         the DOM free of 17-digit floats without reintroducing the whole-pixel drift that a
         `Math.round` causes: a rounded push is off by up to half a pixel, and N cuts put the
         block after them N/2 px out of the plan (3 px at 5 cuts on the Linux runner). */
      const layoutPx = (value) => Math.round(value * 64) / 64;

      /** Every fragment in a block, with the numbers a pass needs to reuse them. One cut or N,
          the shape is the same: a head followed by segments. */
      function fragmentState(el) {
        const frags = [...el.querySelectorAll(":scope > [data-frag]")];
        if (!frags.length) return null;
        const blockTop = layout.rect(el).top;
        const offsets = frags.map((frag) => fragmentOffset(el, frag));
        const pushes = frags.map((frag) => inlineMargin(frag));
        const heights = frags.map((frag) => layout.rect(frag).height);
        return {
          frags,
          offsets,
          pushes,
          heights,
          headHeight: layout.rect(frags[0]).top - pushes[0] - blockTop,
          push: pushes.reduce((sum, value) => sum + value, 0),
        };
      }

      /** The fragment's *current* character offset. Text inserted before it shifts the stored
          `data-frag` value; the boundary, not the number, is the truth. */
      function fragmentOffset(el, frag) {
        const range = document.createRange();
        range.selectNodeContents(el);
        range.setEnd(frag, 0);
        return range.toString().length;
      }

      function mergeBlock(el) {
        const frags = [...el.querySelectorAll("[data-frag]")];
        for (const frag of frags) {
          const parent = frag.parentNode;
          if (!parent) continue;
          while (frag.firstChild) parent.insertBefore(frag.firstChild, frag);
          frag.remove();
          parent.normalize();
        }
        return frags.length;
      }

      /** The block's semantic height while fragmented: its box minus the tail's page push. */
      function semanticH(el) {
        const state = fragmentState(el);
        return layout.measureH(el) - (state ? state.push : 0);
      }

      /* --------------------------------------------------------------- the page plan */

      function plan() {
        const g = geometry();
        const blocks = collectBlocks();

        const pages = [{top: 0, avail: g.contentH, items: []}];
        const spacers = [];
        const splits = [];
        const oversize = [];
        let cursor = 0;
        /* A reused cut can still fit while no longer being tight (text was deleted from the
           head). `stale` asks for one idle merge/re-plan; it is never set by a fresh cut. */
        let stale = false;

        for (let i = 0; i < blocks.length; i++) {
          const el = blocks[i];
          const state = fragmentState(el);
          const h = layout.measureH(el) - (state ? state.push : 0);
          const tall = h > g.contentH; // Check if larger than page height
          let page = pages[pages.length - 1];

          /* A block overflows when it does not fit the space left on the current page. A
             tall *lines* block that starts a fresh page overflows that page too, and must be
             offered to the splitter; an atomic block still gets a page as tall as itself. */
          const spec = strategy(el);
          const firstTallLines = page.items.length === 0
            && fragmenting && spec.kind === "lines" && h > page.top + page.avail;
          if ((page.items.length && cursor + h > page.top + page.avail) || firstTallLines) {
            const blockTop = layout.rect(el).top;

            if (fragmenting && spec.kind === "lines") {
              if (state) {
                /* An empty segment is never a valid cut; merging is the only repair. */
                if (state.frags.some((frag) => frag.textContent.length === 0)) return {needsMerge: true};
                /* A deletion re-cuts now instead of leaving the page short until an idle
                   reconcile: the next lines of the tail belong on this page. Total height and
                   text length are compared, so deleting a `<br>` or an inline element counts
                   too. Both are stable across a no-op pass (see `recordPlanned`). */
                const before = planned.get(el);
                if (before && (h < before.height - 0.5 || el.textContent.length < before.text)) {
                  return {needsMerge: true, rebalance: el};
                }
                /* Reuse every cut when the existing segments still fit their pages: one cut or
                   N, this is the no-churn path while typing after the last one. */
                const room = page.top + page.avail - cursor;
                const ordered = state.offsets.every((offset, k) => k === 0 || offset > state.offsets[k - 1]);
                const fits = ordered
                  && state.offsets[state.offsets.length - 1] < el.textContent.length
                  && state.headHeight <= room - 1
                  && state.heights.every((height) => height <= g.contentH + 1);
                if (fits) {
                  /* Slack is measured in lines: a cut that leaves more than a line and a half
                     at the bottom of its page could move the next lines back into it. The last
                     segment is exempt — the block ends there. */
                  const slack = (before?.lineHeight ?? 18) * 1.5;
                  if (room - state.headHeight > slack) stale = true;
                  for (let k = 0; k < state.heights.length - 1; k++) {
                    if (g.contentH - state.heights[k] > slack) stale = true;
                  }
                  let from = 0;
                  let pageTop = page.top;
                  let avail = page.avail;
                  let cursorHere = cursor;
                  state.frags.forEach((frag, k) => {
                    const nextTop = pageTop + avail + g.chromeGap;
                    page.items.push({block: i, from, to: state.offsets[k]});
                    const tailPage = {top: nextTop, avail: g.contentH, items: []};
                    pages.push(tailPage);
                    splits.push({
                      block: el,
                      offset: state.offsets[k],
                      headHeight: k === 0 ? state.headHeight : state.heights[k - 1],
                      targetTop: nextTop + g.pad,
                      existing: frag,
                      plan: {reused: true},
                    });
                    from = state.offsets[k];
                    page = tailPage;
                    pageTop = nextTop;
                    avail = g.contentH;
                    cursorHere = nextTop;
                  });
                  page.items.push({block: i, from, to: null});
                  const consumed = state.headHeight
                    + state.heights.slice(0, -1).reduce((sum, value) => sum + value, 0);
                  cursor = pageTop + (h - consumed);
                  continue;
                }
                return {needsMerge: true};
              }

              /* Fresh cuts: fill this page, then as many whole pages as the block needs. A
                 tall paragraph is a block like any other now; only an atomic block is not cut. */
              let from = 0;
              let consumed = 0;
              let remaining = h;
              let cuts = 0;
              let room = page.top + page.avail - cursor;
              let pageTop = page.top;
              let avail = page.avail;
              let cursorHere = cursor;
              while (cuts < 64) {
                const cut = planSplit(el, room, spec.minLines ?? 2, from);
                if (!cut || cut.offset <= from) break;
                const nextTop = pageTop + avail + g.chromeGap;
                page.items.push({block: i, from, to: cut.offset});
                const tailPage = {top: nextTop, avail: g.contentH, items: []};
                pages.push(tailPage);
                splits.push({
                  block: el,
                  offset: cut.offset,
                  headHeight: cut.headHeight,
                  targetTop: nextTop + g.pad,
                  existing: null,
                  plan: {
                    room: Math.round(cut.room),
                    start: cut.start,
                    cutLine: cut.cutLine,
                    lines: cut.lines,
                    geometric: cut.geometric,
                    blockTop: Math.round(cut.blockTop),
                    blockHeight: Math.round(cut.blockHeight),
                    headHeight: Math.round(cut.headHeight),
                    cursor: Math.round(cursorHere),
                    nextTop: Math.round(nextTop),
                    lineHeight: cut.lineHeight,
                  },
                });
                from = cut.offset;
                consumed = cut.headBottom - blockTop;
                remaining = h - consumed;
                cuts++;
                page = tailPage;
                pageTop = nextTop;
                avail = g.contentH;
                cursorHere = nextTop;
                room = g.contentH;
                if (remaining <= g.contentH + 1) {
                  tailPage.items.push({block: i, from, to: null});
                  cursor = nextTop + remaining;
                  break;
                }
              }
              if (cuts) {
                if (remaining > g.contentH + 1) {
                  /* No further cut is possible (a one-line remainder, an anchored inline):
                     the tail goes on its page whole, as an atomic tall block does. */
                  page.items.push({block: i, from, to: null});
                  cursor = pageTop + remaining;
                }
                continue;
              }
            }

            /* Nothing above this block on the page: it is the page, so there is no gap to
               insert. Fall through to the tall/whole-block handling below. */
            if (page.items.length) {
              const nextTop = page.top + page.avail + g.chromeGap;
              spacers.push({
                before: el,
                height: nextTop - cursor,
              });
              page = {top: nextTop, avail: g.contentH, items: []};
              pages.push(page);
              cursor = nextTop;
            }
          }
          /* A fragment left on a block that now fits the page is stale: the block is whole
             again, and only a merge can make it so. */
          if (fragmenting && state) return {needsMerge: true};

          /* A page opened by a tall block starts below the flow; the first block on it needs a
             page-start margin. (A page opened by a normal overflow was already pushed by the
             spacer, so `cursor` is already at its top.) */
          if (!page.items.length && cursor < page.top - 0.5) {
            spacers.push({before: el, height: page.top - cursor});
            cursor = page.top;
          }

          // Resizes page size to size of oversized block
          if (tall) {
            page.avail = h;
            oversize.push(i);
          }

          page.items.push({block: i, from: 0, to: null});
          cursor += h;

          if (tall && i < blocks.length - 1) {
            const nextTop = page.top + page.avail + g.chromeGap;
            page = {top: nextTop, avail: g.contentH, items: []};
            pages.push(page);
            /* Leave `cursor` at the tall block's content end. The page opens below the flow, so
               the next block needs a page-start margin to reach its top; resetting cursor to
               `nextTop` here puts that block in the gap. */
          }
        }

        return {
          blocks, pages, spacers, splits, oversize, stale, ...g,
          /* Page content edges in layout px, the coordinate everything else must agree with. */
          pageTops: pages.map((page) => layout.pageContentTop(page, g.pad)),
          pageBottoms: pages.map((page) => layout.pageContentBottom(page, g.pad)),
        };
      }

      // The page gap lives on the block that starts the page, not in a node before it.
      // `plan()` already names exactly those blocks (`p.spacers[].before`), so the arithmetic
      // does not change — only how the gap is realised.
      function applyGaps(p) {
        /* A spacer from an older session is removed, never added. No file the current save
           path writes carries one; this is the one-way migration for a live DOM. */
        for (const sp of [...content.querySelectorAll(".page-spacer")]) sp.remove();

        /* On the 1/64 px layout grid, not rounded to whole pixels: a rounded gap is off by up
           to half a pixel and the page after it inherits the error through the flow (3 px by
           page 36 in a 1,000-block document). */
        const wanted = new Map(p.spacers.map((s) => [s.before, layoutPx(s.height)]));

        // Anything that no longer starts a page loses its margin, in this pass, not later.
        for (const el of [...content.querySelectorAll("[data-page-start]")]) {
          if (wanted.has(el)) continue;
          el.style.marginBlockStart = "";
          el.removeAttribute("data-page-start");
          if (!el.getAttribute("style")) el.removeAttribute("style");
        }

        for (const [block, height] of wanted) {
          /* `setAttribute` queues a mutation record even when the value is identical; a no-op
             pass must not touch the flow at all. */
          if (!block.hasAttribute("data-page-start")) block.setAttribute("data-page-start", "");
          const current = parseFloat(block.style.marginBlockStart || "0");
          if (Math.abs(current - height) > 0.5) block.style.marginBlockStart = height + "px";
        }
      }

      // Use the plan to create sheets, pages, and blocks
      function buildModel(p) {
        return p.pages.map((page, k) => {
          const first = page.items[0];

          return {
            head: "", // intentionally empty for now; not derived from headings
            folio: `${k + 1} / ${p.pages.length}`,
            recto: k % 2 === 0,
            continued: !!first && first.from > 0,
          };
        });
      }

      // Render sheets based off of plan
      function renderSheets(p, model) {
        const need = p.pages.length;
        const cells = [...sheets.children];

        // Removes sheets that don't have page content
        while (cells.length > need) cells.pop().remove();

        while (cells.length < need) {
          const sheet = document.createElement("div");
          sheet.className = "sheet";

          // Adds elements for headers and footers
          for (const slot of ["head", "folio"]) {
            const box = document.createElement("div");
            box.className = "sheet-margin";
            box.dataset.slot = slot;
            sheet.append(box);
          }

          sheets.append(sheet);
          cells.push(sheet);
        }

        cells.forEach((sheet, k) => {
          const pg = p.pages[k];
          const m = model[k];

          sheet.style.top = pg.top + "px";
          sheet.style.height = (pg.avail + 2 * p.pad) + "px"; // Pages height + padding

          sheet.dataset.page = String(k + 1);
          sheet.dataset.side = m.recto ? "recto" : "verso";
          sheet.toggleAttribute("data-first", k === 0);
          sheet.toggleAttribute("data-continued", m.continued);

          sheet.querySelector('[data-slot="head"]').textContent = m.head || "";
          sheet.querySelector('[data-slot="folio"]').textContent = m.folio || "";
        });

        const last = p.pages[need - 1];
        stage.style.minHeight = (last.top + last.avail + 2 * p.pad) + "px";
      }

      // Rendering/reformatting logic:
      let applying = false;
      let timer = null;
      let frame = 0;
      let queued = false;
      let lastRun = 0;

      // Queue up the replanning and page change event
      function schedule() {
        if (queued || applying || signals.composing) return;

        /* While fragmenting, the pass runs in the MutationObserver callback itself: that is
           after the edit and before the next paint. Deferring it by a frame (let alone 120 ms)
           paints the un-cut paragraph first — text in the page gap and over the next sheet —
           and that flash is what "not formatted properly" was. The no-churn path keeps this
           affordable: a pass that changes no cut writes nothing. */
        if (fragmenting) {
          queued = false;
          clearTimeout(timer);
          timer = null;
          if (frame) cancelAnimationFrame(frame);
          frame = 0;
          lastRun = performance.now();
          refresh();
          return;
        }
        queued = true;

        const idle = performance.now() - lastRun > 350;

        clearTimeout(timer);
        timer = setTimeout(() => {
          requestAnimationFrame(() => {
            queued = false;
            /* The guard at scheduling time is not enough: a pass queued before composition
               started would fire in the middle of it. `compositionend` schedules again. */
            if (signals.composing) return;
            lastRun = performance.now();
            refresh();
          });
        }, idle ? 0 : 120);
      }

      signals.on("mutation", () => schedule());
      /* A pass changes margins and heights, which is itself a resize. Running it inside the
         ResizeObserver delivery earns WebKit's "loop completed with undelivered
         notifications" and can drop the notification; a frame later is outside that delivery.
         Typing keeps the synchronous mutation path — its pre-paint timing is the point. */
      signals.on("resize", () => requestAnimationFrame(() => schedule()));
      signals.on("compositionend", schedule);

      (document.fonts ? document.fonts.ready : Promise.resolve()).then(schedule);

      // Refresh setup starting from Plan to rendering sheets
      let lastPlan = null;

      function pageCount() {
        return lastPlan && lastPlan.p ? lastPlan.p.pages.length : 1;
      }

      /* The page under the reader's eye: the sheet covering the centre of the viewport.
         Centre, not top — a tall figure can fill the top of the screen while the reader is
         still on the page above. Layout px, so the zoomed scroll offset is divided out,
         exactly as measureH() does. */
      function pageAt(clientY = viewport.clientHeight / 2) {
        const pages = lastPlan?.p?.pages;
        if (!pages || !pages.length) return 1;
        const y = layout.viewportY(clientY);
        for (let i = 0; i < pages.length; i++) {
          if (y < pages[i].top + pages[i].avail) return i + 1;
        }
        return pages.length;
      }

      /* Every `[data-folio]` in the document, the way zoom.syncUI() owns [data-zoom-label].
         Page numbers are written in one place because two bars show them: the editor's
         minimal chrome and a viewer's bar. A scroll tick, not a signal — pagination does not
         mutate while the reader scrolls. */
      let folioFrame = 0;

      function syncFolio() {
        folioFrame = 0;
        const nodes = document.querySelectorAll("[data-folio]");
        if (!nodes.length) return;
        const text = `p. ${pageAt()} / ${pageCount()}`;
        for (const node of nodes) {
          if (node.textContent !== text) node.textContent = text;
        }
      }

      /* The viewport anchor: the selected block's client top before a pass, restored after.
         The page model can move content when the plan changes (a page added or removed); the
         reader is looking at the caret, so that block must stay put within a line. */
      /* The scroll position the reader had before the pass. A page break can move the caret to
         the next page; following it would scroll a page for a change the reader did not make.
         Keeping the position is the honest default — the text under the caret may move, but the
         view does not chase it. */
      function scrollAnchor() {
        return {scrollTop: viewport.scrollTop};
      }

      function restoreScroll(anchor) {
        if (!anchor) return;
        if (Math.abs(viewport.scrollTop - anchor.scrollTop) > 0.5) {
          viewport.scrollTop = anchor.scrollTop;
        }
      }

      /* The two rAF corrections below belong to the pass that scheduled them. A later pass
         (or an edit that moved the reader) must cancel them: a stale correction was measured
         resetting a scrollTop the reader had just set, because it restored an anchor captured
         before the reader moved. */
      let anchorGeneration = 0;
      let anchorFrames = [];

      function clearScrollCorrections() {
        for (const frame of anchorFrames) cancelAnimationFrame(frame);
        anchorFrames = [];
      }

      function correctScroll(anchor, generation, remaining) {
        if (generation !== anchorGeneration) return;
        restoreScroll(anchor);
        if (remaining > 0) {
          anchorFrames.push(requestAnimationFrame(() => correctScroll(anchor, generation, remaining - 1)));
        }
      }

      let reconcileTimer = null;

      /* One full merge/re-plan after a pause, only when the last plan reused a cut with room
         left to fill. Typing never waits for it; the sync pass keeps the cut stable. */
      function scheduleReconcile() {
        if (!fragmenting || signals.composing) return;
        clearTimeout(reconcileTimer);
        reconcileTimer = setTimeout(() => {
          reconcileTimer = null;
          if (!fragmenting || signals.composing || applying) return;
          refresh({merge: true});
        }, 260);
      }

      function pass({merge = false} = {}) {
        if (applying) return;
        /* Print media hides the probes and resets the page furniture (margins, pushes) so the
           printer can place the breaks. A pass there would plan against a document that is not
           the screen and then fail its own post-conditions; the print keeps the screen plan's
           fragments and breaks, and `afterprint` (editor.js) re-plans at the real viewport. */
        if (env.matchMedia?.("print")?.matches) return;
        clearTimeout(reconcileTimer);
        reconcileTimer = null;
        /* A manual refresh (a mode switch, a demo button) supersedes a queued one. */
        if (queued) {
          clearTimeout(timer);
          timer = null;
          if (frame) cancelAnimationFrame(frame);
          frame = 0;
          queued = false;
        }

        applying = true;
        clearScrollCorrections();

            // PNG may carry alpha, so never flatten it to JPEG. WebP keeps
            // alpha and is usually much smaller. Opaque sources try both.
            const candidates = mime === "image/png"
              ? [["image/webp", 0.9]]
              : [["image/webp", 0.82], ["image/jpeg", 0.82]];
            for (const [format, quality] of candidates) {
              const candidate = canvas.toDataURL(format, quality);
              if (!candidate.startsWith(`data:${format}`)) continue;
              const bytes = dataUrlBytes(candidate);
              if (bytes < bestBytes) {
                bestSrc = candidate;
                bestMime = format;
                bestBytes = bytes;
                encoded = true;
              }
            }
            if (encoded) {
              width = cw;
              height = ch;
            }
          }
        }

        if (!width || !height) {
          const size = await dataUrlSize(bestSrc);
          width = size.width;
          height = size.height;
        }
        return {
          src: bestSrc,
          mime: bestMime,
          width: width || 1200,
          height: height || 800,
          storedBytes: bestBytes,
          encoded,
        };
      }

      async function makeEntry(file, kind, {trusted = false} = {}) {
        const name = file.name || `${kind}-${Date.now()}`;
        const entry = {
          id: uid(),
          kind,
          name,
          mime: file.type || guessMime(name),
          bytes: file.size || 0,
          hash: "",
          src: "",
          width: 0,
          height: 0,
        };
        if (trusted) entry.island = "trusted";

        if (kind === "image") {
          Object.assign(entry, await imagePayload(file));
        } else if (kind === "html") {
          entry.src = dataUrlText(await readDataURL(file));
          entry.mime = "text/html";
          entry.storedBytes = byteLength(entry.src);
        } else if (kind === "media") {
          entry.src = await readDataURL(file);
          entry.media = (file.type || "").startsWith("audio/") ? "audio" : "video";
          entry.storedBytes = dataUrlBytes(entry.src);
        }

        entry.hash = hashString(entry.src);
        entry.bytes = file.size || byteLength(entry.src);
        if (entry.bytes > WARN_BYTES) {
          console.warn(`Figure ${name} is ${(entry.bytes / 1048576).toFixed(1)} MB; saved files will grow by about that much.`);
        }

        // Share the bytes of an identical source. The second figure keeps its
        // own id, caption and size, but points at the first entry's src.
        const shared = findSource(entry);
        if (shared) {
          entry.sourceId = shared.id;
          entry.mime = shared.mime;
          entry.width = shared.width;
          entry.height = shared.height;
          entry.bytes = shared.bytes;
          entry.storedBytes = 0;
          delete entry.src;
        } else {
          if (!entry.storedBytes) entry.storedBytes = byteLength(entry.src);
        }

        store.figures[entry.id] = entry;
        syncStore();
        return entry;
      }

      function defaultCaption(entry) {
        const base = (entry.name || "").replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").trim();
        return base || (entry.kind === "image" ? "Image" : "Figure");
      }

      function createFigure(entry) {
        const figure = document.createElement("figure");
        figure.className = "figure";
        figure.dataset.figureId = entry.id;
        figure.dataset.kind = entry.kind;
        if (entry.media) figure.dataset.media = entry.media;
        markTrusted(figure, entry);
        figure.setAttribute("contenteditable", "false");
        /* Not a tab stop: the frame is rendered content, and in Firefox a
           `contenteditable=false` subtree inside an editable region is focusable, which
           makes Tab walk into every figure. The caption (editable) is still reachable, and
           the figure stays programmatically focusable for `select()`. */
        figure.setAttribute("tabindex", "-1");

        const defaults = DEFAULT_SIZE[entry.kind] || {w: 1, h: 0.72};
        const width = defaults.w;
        const height = entry.kind === "media" && entry.media === "audio" ? "auto" : defaults.h;
        figure.dataset.w = String(width);
        figure.dataset.h = String(height);
        figure.dataset.scale = String(width);
        figure.style.setProperty("--figure-w", String(width));
        figure.style.setProperty("--figure-scale", String(width));
        if (height !== "auto") figure.style.setProperty("--figure-h", String(height));
        if (entry.kind === "image") {
          const source = resolveEntry(entry);
          figure.style.setProperty("--figure-aspect", `${source.width || 16} / ${source.height || 9}`);
        }

        const frame = document.createElement("div");
        frame.className = "figure-frame";
        frame.dataset.runtime = "ephemeral";

        const caption = document.createElement("figcaption");
        caption.setAttribute("contenteditable", "true");
        caption.textContent = defaultCaption(entry);

        figure.append(frame, caption);
        return figure;
      }

      /* The reader's only signal that a figure's content runs unsandboxed. Derived from the
         store (the pin), applied at mount, and stripped on save: the file describes the island
         in one place, and the attribute is this session's rendering of it. */
      function markTrusted(figure, entry) {
        if (entry && (entry.island === "trusted" || entry.trusted === true)) figure.dataset.trusted = "1";
        else figure.removeAttribute("data-trusted");
      }

      /* data-w/data-h are the persisted size. data-scale is kept as the old
         width alias so files saved before this change still load. */
      function normaliseScale(figure) {
        const stored = store.figures[figure.dataset.figureId];
        const entry = resolveEntry(stored);
        const kind = (stored && stored.kind) || figure.dataset.kind;
        const defaults = DEFAULT_SIZE[kind] || {w: 1, h: 0.72};
        const legacy = parseFloat(figure.dataset.scale);
        const rawW = parseFloat(figure.dataset.w);
        const width = Math.max(MIN_SCALE, Math.min(MAX_SCALE,
          Number.isFinite(rawW) ? rawW : Number.isFinite(legacy) ? legacy : defaults.w));

        const rawH = figure.dataset.h;
        let height = rawH === "auto" ? "auto" : parseFloat(rawH);
        if (height !== "auto" && !Number.isFinite(height)) height = defaults.h;

        figure.dataset.w = String(width);
        figure.dataset.scale = String(width);
        figure.style.setProperty("--figure-w", String(width));
        figure.style.setProperty("--figure-scale", String(width));

        if (height === "auto") {
          figure.dataset.h = "auto";
          figure.style.removeProperty("--figure-h");
        } else {
          const h = Math.max(MIN_SCALE, Math.min(MAX_SCALE, height));
          figure.dataset.h = String(h);
          figure.style.setProperty("--figure-h", String(h));
        }

        if (entry && entry.kind === "image") {
          figure.style.setProperty("--figure-aspect", `${entry.width || 16} / ${entry.height || 9}`);
        }
      }

      function htmlDocument(src, csp = null) {
        const policy = csp
          ? `<meta http-equiv="Content-Security-Policy" content="${csp.replace(/"/g, "&quot;")}">`
          : "";
        const html = /<html[\s>]/i.test(src) ? src
          : `<!doctype html><html><head><meta charset="utf-8">${policy}`
            + `<style>html,body{margin:0;padding:0;font-family:system-ui,sans-serif}</style>`
            + `</head><body>${src}</body></html>`;
        /* A source that brings its own <html> gets the policy injected into its head, and the
           policy has to be *first*: a meta CSP is only honoured before the first fetch it
           governs. */
        const withPolicy = csp && !html.includes('http-equiv="Content-Security-Policy"')
          ? (() => {
              const head = html.match(/<head[^>]*>/i);
              if (head) {
                const at = head.index + head[0].length;
                return html.slice(0, at) + policy + html.slice(at);
              }
              const doctype = html.match(/<!doctype[^>]*>/i);
              const at = doctype ? doctype.index + doctype[0].length : 0;
              return html.slice(0, at) + policy + html.slice(at);
            })()
          : html;
        const html2 = withPolicy;
        if (html2.includes("data-figure-bridge")) return html2;
        const tag = SNAPSHOT_TAG.replace("<script>", "<script data-figure-bridge>", 1);
        const head = html2.match(/<head[^>]*>/i);
        if (head) {
          const at = head.index + head[0].length;
          return html2.slice(0, at) + tag + html2.slice(at);
        }
        const doctype = html2.match(/<!doctype[^>]*>/i);
        if (doctype) {
          const at = doctype.index + doctype[0].length;
          return html2.slice(0, at) + tag + html2.slice(at);
        }
        return tag + html2;
      }

      /* ---- plugins ---------------------------------------------------------
         A figure may need a plugin. The plugin is not part of this module: it is built
         on demand, verified, and may be absent — in which case the figure keeps its
         place in the document and says why. A missing plugin is a missing *view*, never
         a missing figure: the element and its store entry are untouched, so the file is
         byte-stable and the plugin can be added later. */
      const pluginOf = (entry) => (entry && entry.plugin && entry.plugin.id ? entry.plugin : null);

      /* How many figures in this document need each plugin. The count is what the
         settings sheet shows and what the save policy floors on; whether the plugin is
         in the file is still the author's choice. */
      function pluginUsage() {
        const usage = {};
        for (const figure of content.querySelectorAll("figure.figure")) {
          const plugin = pluginOf(store.figures[figure.dataset.figureId]);
          if (!plugin) continue;
          usage[plugin.id] = (usage[plugin.id] || 0) + 1;
        }
        return usage;
      }

      /* Short, because it sits in a figure frame: the reason, not the diagnosis. */
      function pluginReason(error) {
        switch (error && error.kind) {
          case "unresolved": return "not in this copy of the file";
          case "disabled": return "switched off in this document";
          case "integrity": return "its bytes do not match the pinned hash";
          case "api": return "it needs a newer version of this document";
          case "stale": return "it was unloaded while loading";
          default: return (error && error.message) || "it could not be loaded";
        }
      }

      function pluginNotice(figure, state, error) {
        const frame = figure.querySelector(".figure-frame");
        if (!frame) return;
        const plugin = pluginOf(store.figures[figure.dataset.figureId]) || {};
        const label = plugin.label || plugin.id || "A plugin";
        const failed = state === "failed";
        const notice = document.createElement("div");
        notice.className = "figure-plugin";
        notice.dataset.state = state;
        notice.textContent = failed ? `Needs ${label} — ${pluginReason(error)}. Click to retry.` : `Loading ${label}…`;
        if (failed) {
          notice.onclick = () => {
            /* The only automatic retry is none: a failing plugin must not refetch on
               every scroll. A click is deliberate. */
            delete figure.dataset.pluginState;
            frame.replaceChildren();
            mount(figure);
          };
        }
        frame.replaceChildren(notice);
      }

      async function mountWithPlugin(figure, plugin) {
        const registry = env && env.StandaloneDoc;
        if (!registry || typeof registry.require !== "function") {
          figure.dataset.pluginState = "failed";
          pluginNotice(figure, "failed", { kind: "unresolved" });
          return;
        }
        figure.dataset.pluginState = "loading";
        pluginNotice(figure, "loading");
        try {
          await registry.require(plugin.id);
          /* Scrolled away, or unloaded, while the bytes were in flight. */
          if (!figure.isConnected || figure.dataset.pluginState !== "loading") return;
          figure.dataset.pluginState = "ready";
          const frame = figure.querySelector(".figure-frame");
          if (frame) frame.replaceChildren();
          mount(figure);
        } catch (error) {
          if (!figure.isConnected) return;
          figure.dataset.pluginState = "failed";
          pluginNotice(figure, "failed", error);
        }
      }

      function mount(figure) {
        if (!figure || !figure.isConnected) return;
        const stored = store.figures[figure.dataset.figureId];
        const entry = resolveEntry(stored);
        const frame = figure.querySelector(".figure-frame");
        if (!entry || !frame) {
          figure.dataset.missing = "";
          return;
        }

        /* The plugin comes before the kind: a figure cannot render without it, and the
           loading/failed state is the figure's own, not the document's. */
        const plugin = pluginOf(stored);
        if (plugin && figure.dataset.pluginState !== "ready") {
          if (figure.dataset.pluginState === "loading" || figure.dataset.pluginState === "failed") return;
          return mountWithPlugin(figure, plugin);
        }

        figure.removeAttribute("data-missing");
        markTrusted(figure, stored && stored.island ? stored : entry);
        if (frame.firstElementChild) {
          figure.dataset.mounted = "";
          return;
        }

        if (entry.kind === "image") {
          const img = new Image();
          img.decoding = "async";
          img.alt = (figure.querySelector("figcaption")?.textContent || entry.name || "").trim();
          img.src = entry.src;
          frame.append(img);
        } else if (entry.kind === "html") {
          const iframe = document.createElement("iframe");
          /* Mounting is already gated by IntersectionObserver. Native
             loading=lazy on srcdoc can defer the very island we just decided
             to mount, so it is deliberately not used here. */
          const profile = profileOf(stored);
          iframe.setAttribute("sandbox", profile.sandbox);
          iframe.setAttribute("title", entry.name || "Embedded figure");
          iframe.setAttribute("referrerpolicy", "no-referrer");
          /* A pure affordance is a permissions-policy grant, not a sandbox flag: a plugin may
             ask for fullscreen, and nothing else, without gaining capability. */
          if (Array.isArray(stored && stored.permissions) && stored.permissions.length) {
            iframe.setAttribute("allow", stored.permissions.join("; "));
          }
          iframe.srcdoc = htmlDocument(entry.src, profile.csp);
          frame.append(iframe);
          mounted.set(figure, {el: iframe});
        } else if (entry.kind === "media") {
          const el = document.createElement(entry.media === "audio" ? "audio" : "video");
          el.controls = true;
          el.preload = "metadata";
          el.src = entry.src;
          if (entry.media === "video") el.playsInline = true;
          frame.append(el);
        }
        figure.dataset.mounted = "";
      }

      function unmount(figure) {
        const rec = mounted.get(figure);
        if (rec) {
          if (rec.url) URL.revokeObjectURL(rec.url);
          rec.el.remove();
          mounted.delete(figure);
        }
        const media = figure && figure.querySelector(".figure-frame video, .figure-frame audio");
        if (media) {
          try {media.pause();} catch { }
          media.removeAttribute("src");
          try {media.load();} catch { }
          media.remove();
        }
        /* A notice is runtime state too: scrolled away is not the same as failed. */
        if (figure) {
          figure.querySelectorAll(".figure-frame .figure-plugin").forEach((node) => node.remove());
          delete figure.dataset.pluginState;
        }
        if (figure) delete figure.dataset.mounted;
      }

      function unmountAll() {
        for (const figure of [...mounted.keys()]) unmount(figure);
        if (observer) observer.disconnect();
      }

      /* ---- bytes into an island ------------------------------------------
         The mirror of __figureBytes() in the bridge. Authorization is the *figure*, not the
         request: an island may only ask for the asset ids its store entry declares, so a
         hostile island gets nothing the document did not already intend to hand it. */
      async function onIslandMessage(event) {
        const data = event.data;
        if (!data || data.type !== "figure-bytes-request" || !data.id) return;
        const source = event.source;
        const figure = [...content.querySelectorAll("figure.figure")].find(
          (candidate) => candidate.querySelector("iframe")?.contentWindow === source,
        );
        const reply = (payload, transfer) =>
          source.postMessage(Object.assign({ type: "figure-bytes", id: data.id }, payload), "*", transfer || []);

        const stored = figure && store.figures[figure.dataset.figureId];
        if (!stored) return reply({ error: "this island is not a mounted figure" });
        const declared = Array.isArray(stored.assets) ? stored.assets : [];
        if (!declared.includes(data.name)) {
          return reply({ error: `"${data.name}" is not declared by this figure` });
        }
        const standalone = env && env.StandaloneDoc;
        if (!standalone || typeof standalone.bytes !== "function") return reply({ error: "this document cannot supply bytes" });
        try {
          const bytes = await standalone.bytes(data.name);
          /* One copy, and transfer that same reference: handing over the cached ArrayBuffer would
             neuter the parent's copy for the next island that asks for the same runtime. */
          const copy = bytes.slice(0);
          reply({ bytes: copy }, [copy]);
        } catch (error) {
          reply({ error: (error && error.message) || String(error) });
        }
      }
      window.addEventListener("message", onIslandMessage);

      /* ---- export-only snapshots ----------------------------------------
         The bridge is injected into every HTML island's srcdoc. It answers
         ping/snapshot messages. The serializer source is supplied by the
         Export module only when a static export starts. */
      function onSnapshotMessage(event) {
        const data = event.data;
        if (!data || !data.id) return;
        const waiter = snapshotWaiters.get(data.id);
        if (!waiter) return;
        if (data.type === "figure-snapshot-progress") {
          if (waiter.onProgress) waiter.onProgress(data);
          return;
        }
        if (data.type !== "figure-snapshot-result") return;
        snapshotWaiters.delete(data.id);
        clearTimeout(waiter.timer);
        waiter.resolve(data);
      }
      window.addEventListener("message", onSnapshotMessage);

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function requestSnapshot(win, message, timeout = 30000, onProgress = null) {
        return new Promise((resolve) => {
          const id = "snap-" + (++snapshotSeq) + "-" + Math.random().toString(36).slice(2);
          const timer = setTimeout(() => {
            snapshotWaiters.delete(id);
            resolve({ok: false, timeout: true, error: "snapshot timed out"});
          }, timeout);
          snapshotWaiters.set(id, {resolve, timer, onProgress});
          try {
            win.postMessage(Object.assign({id}, message), "*");
          } catch (err) {
            snapshotWaiters.delete(id);
            clearTimeout(timer);
            resolve({ok: false, error: String(err)});
          }
        });
      }

      async function waitForBridge(win, tries = 60) {
        for (let i = 0; i < tries; i++) {
          const res = await requestSnapshot(win, {type: "figure-ping"}, 400);
          if (res.ok) return res;
          await sleep(100);
        }
        return {ok: false, error: "snapshot bridge did not answer"};
      }

      function videoSnapshot(figure) {
        const video = figure.querySelector(".figure-frame video");
        if (!video || !video.videoWidth) return null;
        try {
          const canvas = document.createElement("canvas");
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
          return canvas.toDataURL("image/webp", 0.9);
        } catch (err) {
          return null;
        }
      }

      async function snapshot(figure, options = {}) {
        const stored = store.figures[figure.dataset.figureId];
        const entry = resolveEntry(stored);
        const kind = (stored && stored.kind) || figure.dataset.kind;
        if (!entry) return {ok: false, error: "figure source is missing"};

        if (kind === "image") {
          return {ok: true, dataUrl: entry.src, width: entry.width, height: entry.height,
            engine: "image-src"};
        }

        if (kind === "media") {
          if (entry.media === "audio") {
            return {ok: false, error: "audio has no visual snapshot"};
          }
          const dataUrl = videoSnapshot(figure);
          return dataUrl
            ? {ok: true, dataUrl, engine: "video-frame"}
            : {ok: false, error: "video frame is not ready"};
        }

        const iframe = figure.querySelector(".figure-frame iframe");
        if (!iframe) return {ok: false, error: "island is not mounted"};
        const ping = await waitForBridge(iframe.contentWindow);
        if (!ping.ok) return {ok: false, error: ping.error || "island did not answer"};
        return requestSnapshot(iframe.contentWindow, {
          type: "figure-snapshot",
          lib: options.lib || "",
          pixelRatio: options.pixelRatio || 2,
          format: options.format || "webp",
          quality: options.quality == null ? 0.9 : options.quality,
          background: options.background || "#ffffff",
        }, options.timeout || 30000, options.onProgress);
      }

      function suspendObserver() {
        observing = false;
        if (observer) observer.disconnect();
      }

      function resumeObserver() {
        observing = true;
        scan();
      }

      function scrollIntoViewForCapture(figure) {
        const rect = figure.getBoundingClientRect();
        if (rect.top >= 0 && rect.bottom <= window.innerHeight) return null;
        const previous = viewport.scrollTop;
        viewport.scrollTop += rect.top - 80;
        return previous;
      }

      async function captureAll(options = {}) {
        const figures = [...content.querySelectorAll("figure.figure")];
        const out = [];
        const mountedForExport = new Set();
        suspendObserver();
        try {
          for (let i = 0; i < figures.length; i++) {
            if (options.signal && options.signal.aborted) break;
            const figure = figures[i];
            const kind = figure.dataset.kind;
            const progress = options.onProgress;
            if (progress) progress({phase: "mount", index: i + 1, total: figures.length, figure});

            const wasMounted = !!figure.querySelector(".figure-frame iframe, .figure-frame video");
            if ((kind === "html" || kind === "media") && !wasMounted) {
              /* Awaited: a plugin-backed figure may have to be built before it can be
                 captured, and this loop must not race ahead. */
              await mount(figure);
              mountedForExport.add(figure);
            }

            let previousScroll = null;
            if (kind === "html") {
              previousScroll = scrollIntoViewForCapture(figure);
              if (previousScroll != null) await sleep(120);
            }

            let capture;
            try {
              capture = await snapshot(figure, {
                lib: options.lib,
                pixelRatio: options.pixelRatio,
                format: options.format,
                quality: options.quality,
                onProgress: progress ? (p) => progress({
                  phase: "capture", index: i + 1, total: figures.length,
                  step: p.step, ms: p.ms, figure,
                }) : null,
              });
            } catch (err) {
              capture = {ok: false, error: String(err && err.message || err)};
            }

            if (previousScroll != null) viewport.scrollTop = previousScroll;
            out.push(Object.assign({figure, id: figure.dataset.figureId, kind}, capture));

            if (mountedForExport.has(figure)) {
              unmount(figure);
              mountedForExport.delete(figure);
            }
          }
        } finally {
          for (const figure of [...mountedForExport]) unmount(figure);
          resumeObserver();
          if (options.onProgress) options.onProgress({phase: "done", total: figures.length});
        }
        return out;
      }

      /* Developer/test switches. Normal operation never calls these; they make
         a single figure's mount/unmount observable without scroll timing. */
      function pause() {
        observing = false;
        if (observer) observer.disconnect();
        scan();
      }

      function resume() {
        observing = true;
        scan();
      }

      function scan() {
        const figures = [...content.querySelectorAll("figure.figure")];
        for (const figure of figures) {
          const entry = store.figures[figure.dataset.figureId];
          if (!entry) {
            figure.dataset.missing = "";
            continue;
          }
          figure.removeAttribute("data-missing");
          /* Files saved before this attribute existed get it on the next save. */
          figure.setAttribute("tabindex", "-1");
          normaliseScale(figure);

          if (entry.kind === "image") {
            mount(figure);
            continue;
          }
          if (!observer || !observing) {
            mount(figure);
          } else {
            observer.observe(figure);
          }
        }

        for (const figure of [...mounted.keys()]) {
          if (!figure.isConnected || !content.contains(figure)) unmount(figure);
        }
        if (selected && !selected.isConnected) select(null);
      }

      function scheduleScan() {
        clearTimeout(scanTimer);
        scanTimer = setTimeout(scan, 80);
      }

      function positionTools(figure) {
        if (!tools || !figure) return;
        const rect = figure.getBoundingClientRect();
        const toolbar = document.getElementById("app-toolbar");
        const toolbarBottom = toolbar ? toolbar.getBoundingClientRect().bottom : 0;
        const minTop = Math.max(8, toolbarBottom + 8);

        if (rect.bottom < 0 || rect.top > window.innerHeight || rect.bottom <= minTop) {
          tools.hidden = true;
          return;
        }

        const pad = 8;
        const width = tools.offsetWidth || 260;
        const maxTop = Math.max(minTop, window.innerHeight - tools.offsetHeight - pad);
        tools.hidden = false;
        tools.style.left = `${Math.max(pad, Math.min(window.innerWidth - width - pad, rect.right - width))}px`;
        tools.style.top = `${Math.min(maxTop, Math.max(minTop, rect.top + 6))}px`;

        if (toolsW) {
          const w = parseFloat(figure.dataset.w || figure.dataset.scale) || 1;
          toolsW.textContent = `${Math.round(w * 100)}%`;
        }
        if (toolsH) {
          const h = figure.dataset.h;
          toolsH.textContent = h === "auto" ? "auto" : `${Math.round((parseFloat(h) || 0.72) * 100)}%`;
        }
      }

      function select(figure) {
        if (selected && selected !== figure) selected.removeAttribute("data-selected");
        selected = figure || null;
        if (!selected) {
          if (tools) tools.hidden = true;
          return;
        }
        selected.setAttribute("data-selected", "");
        positionTools(selected);
      }

      function setDimension(figure, dimension, value) {
        if (!figure) return;

        if (dim === "h" && value === "auto") {

          const next = Math.max(MIN_SCALE, Math.min(MAX_SCALE, Math.round(Number(value) * 100) / 100));
          figure.dataset[dim] = String(next);
          figure.style.setProperty(`--figure-${dim}`, String(next));
          if (dim === "w") {

      function setScale(figure, scale) {

      function resetSize(figure) {

        const stored = store.figures[figure.dataset.figureId];
        const entry = resolveEntry(stored);
        const kind = (stored && stored.kind) || figure.dataset.kind;
        const defaults = DEFAULT_SIZE[kind] || {w: 1, h: 0.72};
        const height = kind === "media" && entry && entry.media === "audio" ? "auto" : defaults.h;

      function remove(figure) {

      function referencedIds(root) {

      /**

          kind: "html",

          hash: hashString(html),

        if (island) entry.island = island;

           so a later plugin version cannot widen it. */

      /* Called on the save clone only. The live store keeps entries for an
         undo/redo stack that can still put a deleted figure back. */
      function prepareClone(clone) {
        clone.querySelectorAll("[data-runtime='ephemeral']").forEach((el) => el.replaceChildren());
        clone.querySelectorAll("figure.figure").forEach((figure) => {
          figure.removeAttribute("data-selected");
          figure.removeAttribute("data-mounted");
          figure.removeAttribute("data-missing");
          /* Loading/ready/failed is this session's observation of a plugin, not part of
             the figure. The store entry keeps the pin; the state does not travel. */
          figure.removeAttribute("data-plugin-state");
          /* Derived from the store entry, so the file never carries it. */
          figure.removeAttribute("data-trusted");

        const add = (id) => {
          const entry = store.figures[id];
          if (!entry || out.figures[id]) return;
          out.figures[id] = entry;
          if (entry.sourceId) add(entry.sourceId);

        if (target) target.textContent = JSON.stringify(out).replace(/</g, "\\u003c");

      function blockAtPoint(x, y) {
        const el = document.elementFromPoint(x, y);
        if (!el || !content.contains(el)) return null;

      function pick(kind = "any") {

          : pickKind === "media" ? "video/*,audio/*"
          : "image/*,.svg,text/html,.html,.htm,video/*,audio/*";

      async function insertFiles(fileList, {after = null, kindHint = "any", trusted = false} = {}) {

        const created = [];
        let anchor = after;

        for (const file of files) {
          try {

            if (!kind) {
              console.warn(`Unsupported figure type: ${file.name || file.type}`);
              continue;
            }
            if (kindHint !== "any" && kind !== kindHint) {
              console.warn(`Skipping ${file.name}: expected ${kindHint}, got ${kind}`);
              continue;
            }
            const entry = await makeEntry(file, kind, {trusted});
            const figure = createFigure(entry);
            editor()?.insertBlock(figure, {after: anchor});
            anchor = figure;
            created.push(figure);
          } catch (err) {
            console.error("Figure import failed", file.name, err);
          }
        }

        if (created.length) {
          syncStore();
          scan();
          pagination.schedule();
          status()?.markDirty();
        }
        return created;
      }

      function onPaste(event) {
        const dt = event.clipboardData;
        if (!dt) return;
        const files = [];
        for (const item of dt.items || []) {
          if (item.kind !== "file" || !item.type.startsWith("image/")) continue;
          const file = item.getAsFile();
          if (file) files.push(file);
        }
        if (!files.length) return; // leave ordinary text/HTML paste native
        event.preventDefault();
        insertFiles(files);
      }

      function onDragOver(event) {
        if (!event.dataTransfer || ![...event.dataTransfer.types].includes("Files")) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
        content.classList.add("is-drop-target");
      }

      function onDragLeave(event) {
        if (!content.contains(event.relatedTarget)) content.classList.remove("is-drop-target");
      }

      function onDrop(event) {
        if (!event.dataTransfer || !event.dataTransfer.files.length) return;
        event.preventDefault();
        content.classList.remove("is-drop-target");
        const after = blockAtPoint(event.clientX, event.clientY);
        insertFiles(event.dataTransfer.files, {after});
      }

      function init() {
        if (!storeEl) {
          console.warn("No #figure-store found; figure import disabled");
          return;
        }
        store = readStore();
        /* Give status the exact store size from now on. Before this point it counts
           the raw store text; status cannot depend on figures (it is built first and
           refreshes during construction), so the estimator travels this way. */
        status()?.setStoreEstimator(savedStoreBytes);
        syncStore();

        if ("IntersectionObserver" in window) {
          observer = new IntersectionObserver((entries) => {
            for (const entry of entries) {
              const figure = entry.target;
              if (!figure.isConnected) {

        }

        if (input) {
          input.addEventListener("change", async () => {
            const files = [...(input.files || [])];
            const hint = pickKind;
            const useTrusted = pickTrusted;
            pickKind = "any";
            pickTrusted = false;
            input.value = "";
            await insertFiles(files, {kindHint: hint, trusted: useTrusted});
          });
        }

        content.addEventListener("paste", onPaste);
        content.addEventListener("dragover", onDragOver);
        content.addEventListener("dragleave", onDragLeave);
        content.addEventListener("drop", onDrop);

        document.addEventListener("click", (event) => {
          /* Selection is an editing affordance: #figure-tools is an edit-only fragment, so an
             outline in a viewer promises actions that cannot exist (lab/010, measured). */
          const mode = env?.StandaloneDoc?.settings?.().mode ?? document.documentElement.dataset.mode;
          /* Selection is an editing affordance. A review copy's text is locked, and a
             viewer's has no tools to offer: only the editor selects a figure. */
          if (mode !== "edit") return;
          const figure = event.target.closest && event.target.closest("figure.figure");
          if (figure && content.contains(figure)) {
            select(figure);
            return;
          }
          if (event.target.closest && event.target.closest("#figure-tools")) return;
          select(null);
        });

        if (tools) {
          tools.addEventListener("mousedown", (event) => event.preventDefault());
          tools.addEventListener("click", (event) => {
            const button = event.target.closest("button");
            if (!button || !selected) return;
            if (button.hasAttribute("data-figure-remove")) {
              remove(selected);
              return;
            }
            if (button.hasAttribute("data-figure-reset")) {
              resetSize(selected);
              return;
            }
            const dimButton = button.closest("[data-figure-dim]");
            if (dimButton) {
              const dim = dimButton.dataset.figureDim;
              const direction = button.dataset.figureStep;
              const step = direction === "+" ? 0.1 : -0.1;
              const entry = store.figures[selected.dataset.figureId];
              const kind = (entry && entry.kind) || selected.dataset.kind;
              const defaults = DEFAULT_SIZE[kind] || {w: 1, h: 0.72};
              let current = parseFloat(dim === "h" ? selected.dataset.h : selected.dataset.w);
              if (!Number.isFinite(current)) {
                current = dim === "h" && defaults.h === "auto" ? 0.7 : defaults[dim];
              }
              setDimension(selected, dim, current + step);
            }
          });
        }

        viewport.addEventListener("scroll", () => {
          if (selected) positionTools(selected);
        }, {passive: true});
        window.addEventListener("resize", () => {
          if (selected) positionTools(selected);
        });

        signals.on("layout", scan);
        signals.on("mutation", scheduleScan);
        signals.on("compositionend", scheduleScan);
        scan();
        status()?.save();
      }

      const api = {
        init, pick, insertFiles, scan, mount, unmount, unmountAll, pause, resume,
        suspendObserver, resumeObserver, snapshot, captureAll, pluginUsage, insertHTML,
        setScale, setDimension, resetSize, remove, select, prepareClone, storeJSON, storeBytes, savedStoreBytes,
        get store() {return store;},
        get selected() {return selected;},
      };

      /* The capability a plugin may resolve with host.use("figures"). Deliberately narrow:
         inserting is a host operation, and reading usage is what a panel wants. */
      const registry = env && env.StandaloneDoc;
      if (registry && typeof registry.provide === "function") {
        registry.provide("figures", {insertHTML, scan, usage: pluginUsage});
      }
      /* retry() tears the graph down and builds it again, so anything mounted before it is
         stale. A rescan also picks up a plugin that finished loading during boot. */
      if (registry && typeof registry.on === "function") {
        registry.on("ready", () => scan());
      }

      /* Construction-time, exactly where the IIFE's trailing Figures.init() ran. */
      init();
      return api;
    }
    StandaloneDoc.register("figures", createFigures);
  </script>
