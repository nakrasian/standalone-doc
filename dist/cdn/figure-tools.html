<span class="figure-dim" data-dim="w">
  <span class="figure-dim-label">W</span>
  <button data-figure-dim="w" data-figure-step="-" title="Narrower figure">−</button>
  <span class="figure-dim-value" data-figure-w-value>100%</span>
  <button data-figure-dim="w" data-figure-step="+" title="Wider figure">+</button>
</span>
<span class="figure-dim" data-dim="h">
  <span class="figure-dim-label">H</span>
  <button data-figure-dim="h" data-figure-step="-" title="Shorter figure">−</button>
  <span class="figure-dim-value" data-figure-h-value>auto</span>
  <button data-figure-dim="h" data-figure-step="+" title="Taller figure">+</button>
</span>
<button data-figure-reset title="Reset figure size">Fit</button>
<button data-figure-remove title="Remove figure">Remove</button>
