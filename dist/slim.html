<!doctype html>
<html lang="en-US" data-boot-state="booting">

<head>
  <meta charset="utf-8" />
  <title>Standalone HTML Doc</title>
  <!-- CORE STYLES: CSS, Typography, and Pagination -->
<!-- @asset id="boot-ui-styles" kind="css" order="25" -->
  <style id="boot-ui-styles">
    /* Boot shell styles. Self-contained on purpose: this file must render before
       any other asset exists, so it may not rely on core.css or its variables. */

    /* Nothing behind the dialog until boot says so: this is what stops the markup and
       the SVG sprite from painting before the stylesheets have arrived. `visibility`
       keeps layout, so revealing the app later does not reflow. */
    html[data-boot-state="booting"],
    html[data-boot-state="failed"] {
      background: #e0e0e0;
    }
    html[data-boot-state="booting"] body > :not(script):not(style):not(link):not(#boot-dialog),
    html[data-boot-state="failed"] body > :not(script):not(style):not(link):not(#boot-dialog) {
      visibility: hidden;
    }

    #boot-dialog {
      --boot-ink: #1b1f24;
      --boot-muted: #6b7280;
      --boot-line: #dfe1e6;
      --boot-paper: #fff;
      --boot-chrome: #fbfbfc;
      --boot-accent: #2f6fed;
      --boot-danger: #b3261e;
      --boot-danger-soft: rgba(179, 38, 30, .08);
      --boot-ok: #1a7f47;

      width: min(520px, calc(100vw - 32px));
      padding: 0;
      border: 1px solid var(--boot-line);
      border-radius: 10px;
      background: var(--boot-paper);
      color: var(--boot-ink);
      box-shadow: 0 12px 32px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .06);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    #boot-dialog::backdrop { background: rgba(16, 24, 40, .28); }
    /* The dialog is a container, not a control: a focus ring around the whole card is
       noise. Focus is moved to Retry (or the first button) on failure. */
    #boot-dialog:focus,
    #boot-dialog:focus-visible { outline: none; }

    #boot-dialog .boot-head { display: flex; gap: 10px; align-items: flex-start; padding: 16px 18px 12px; }
    #boot-dialog .boot-mark {
      width: 22px; height: 22px; flex: 0 0 auto; margin-top: 1px; border-radius: 6px;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
      background: var(--boot-accent); color: #fff;
    }
    #boot-dialog[data-phase="failed"] .boot-mark { background: var(--boot-danger); }
    #boot-dialog h1 { margin: 0; font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
    #boot-dialog .boot-sub { margin: 2px 0 0; color: var(--boot-muted); font-size: 12.5px; }
    #boot-dialog .boot-body { padding: 0 18px 14px; max-height: 62vh; overflow: auto; }
    #boot-dialog .boot-foot {
      display: flex; gap: 8px; align-items: center; padding: 11px 18px;
      border-top: 1px solid var(--boot-line); background: var(--boot-chrome);
    }
    #boot-dialog .boot-foot .spacer { flex: 1; }

    #boot-dialog button {
      font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 7px; cursor: pointer;
      border: 1px solid var(--boot-line); background: var(--boot-paper); color: var(--boot-ink);
    }
    #boot-dialog button.primary { background: var(--boot-accent); border-color: var(--boot-accent); color: #fff; }
    #boot-dialog button:focus-visible { outline: 2px solid var(--boot-accent); outline-offset: 2px; }

    #boot-dialog .boot-bar {
      height: 5px; border-radius: 99px; background: #eceef2; overflow: hidden; margin: 2px 0 12px;
    }
    #boot-dialog .boot-fill {
      display: block; height: 100%; background: var(--boot-accent);
      width: 100%; transform: scaleX(0); transform-origin: left;
      transition: transform .32s ease-out;
    }

    #boot-dialog .boot-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    #boot-dialog .boot-row {
      display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center;
      font-size: 12.5px; color: var(--boot-muted);
    }
    #boot-dialog .boot-name { color: var(--boot-ink); }
    #boot-dialog .boot-detail { font-size: 11.5px; font-variant-numeric: tabular-nums; }
    #boot-dialog .boot-row[data-state="pending"] { opacity: .5; }
    #boot-dialog .boot-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--boot-line); justify-self: center; }
    #boot-dialog .boot-row[data-state="active"] .boot-name { color: var(--boot-accent); }
    #boot-dialog .boot-row[data-state="active"] .boot-dot { background: var(--boot-accent); animation: boot-pulse 1s infinite; }
    #boot-dialog .boot-row[data-state="ok"] .boot-dot { background: var(--boot-ok); }
    #boot-dialog .boot-row[data-state="failed"] .boot-dot,
    #boot-dialog .boot-row[data-state="fail"] .boot-dot { background: var(--boot-danger); }
    #boot-dialog .boot-row[data-state="failed"] .boot-name,
    #boot-dialog .boot-row[data-state="fail"] .boot-name { color: var(--boot-danger); }

    @keyframes boot-pulse { 50% { opacity: .35; } }

    #boot-dialog .boot-error {
      display: grid; grid-template-columns: 18px 1fr; gap: 8px;
      margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--boot-line);
    }
    #boot-dialog .boot-error[hidden] { display: none; }
    #boot-dialog .boot-error-icon { color: var(--boot-danger); }
    #boot-dialog .boot-error-title { margin: 0 0 3px; font-size: 13px; font-weight: 650; }
    #boot-dialog .boot-error-body { margin: 0; color: var(--boot-muted); font-size: 12.5px; overflow-wrap: anywhere; }

    #boot-dialog .boot-diag {
      margin: 10px 0 0; max-height: 180px; padding: 9px 11px; border: 1px solid var(--boot-line); border-radius: 7px;
      background: #f7f8fa; color: #3d4450; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px; white-space: pre-wrap; max-height: 220px; overflow: auto;
    }
    #boot-dialog .boot-diag[hidden] { display: none; }

    @media (prefers-reduced-motion: reduce) {
      #boot-dialog .boot-fill { transition: none; }
      #boot-dialog .boot-dot { animation: none !important; }
    }
  </style>

      <div id="sheets" data-generated aria-hidden="true"></div>

  <!-- Shared content signals -->
  <!-- The boot shell's markup. Inert until it is opened; defined before the
       bootstrap runs so boot() can report into it. -->
  <dialog id="boot-dialog" aria-labelledby="boot-title" aria-describedby="boot-sub">
    <div class="boot-head">
      <span class="boot-mark" aria-hidden="true">&#9680;</span>
      <div>
        <h1 id="boot-title" data-boot-title>Starting the editor</h1>
        <p class="boot-sub" id="boot-sub" data-boot-sub></p>
      </div>
    </div>
    <div class="boot-body">
      <div class="boot-bar" data-boot-bar role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Starting the editor">
        <span class="boot-fill" data-boot-fill></span>
      </div>
      <ul class="boot-rows" data-boot-rows aria-live="polite"></ul>
      <div class="boot-error" data-boot-error hidden>
        <span class="boot-error-icon" aria-hidden="true">&#9888;</span>
        <div>
          <p class="boot-error-title" data-boot-error-title></p>
          <p class="boot-error-body" data-boot-error-body></p>
          <pre class="boot-diag" data-boot-diag hidden></pre>
        </div>
      </div>
    </div>
    <div class="boot-foot">
      <button type="button" data-boot-toggle hidden>Diagnostics</button>
      <span class="spacer"></span>
      <button type="button" data-boot-copy hidden>Copy diagnostics</button>
      <button type="button" class="primary" data-boot-retry hidden>Retry</button>
    </div>
  </dialog>

  <script id="registry">
    /* The container: the only global. Assets register their factory (inline) or are
       resolved from the CDN, and boot() builds them in manifest order — never
       document order. */
    globalThis.StandaloneDoc = globalThis.StandaloneDoc || (function () {
      "use strict";

      const factories = Object.create(null);
      const modules = Object.create(null);
      const errors = [];
      const listeners = Object.create(null);
      const injected = [];
      const sources = Object.create(null);
      let state = "declared";
      let parsed = null;
      let settingsParsed = null;
      let settingsText = null;

      /* The shell gates the app on this attribute, so it must be set wherever state
         changes — never by the UI, which only observes. */

        state = next;

      }

      /* The manifest is authoritative for order/deps/mode; a registration only
         supplies the factory, which is what makes the inline and CDN flavours the
         same code path. */
      function register(id, factory) {
        /* Idempotent by id: a hand-concatenated document may contain the same block
           twice. The first registration wins, so the module is built only once. */
        if (factories[id]) return;
        factories[id] = factory;
      }

      function manifest() {
        if (parsed) return parsed;
        const el = document.getElementById("asset-manifest");
        try {
          parsed = el ? JSON.parse(el.textContent) : { assets: [] };
        } catch (error) {
          parsed = { assets: [], parseError: String(error && error.message) };
        }
        return parsed;
      }

      /* How this document behaves. Derived from #doc-settings; `manifest().mode` is
         read as a fallback for documents saved before the block existed (one release
         of compatibility, not a permanent second source of truth). */
      function settings() {
        const el = document.getElementById("doc-settings");
        const text = el ? el.textContent : "";
        /* Keyed on the block's text: the save path writes `thresholdDeclined` into it, and
           a cached parse would make the sticky choice invisible until the next open. */
        if (settingsParsed && text === settingsText) return settingsParsed;
        settingsText = text;
        let authored = null;
        try {
          authored = el ? JSON.parse(el.textContent) : null;
        } catch (error) {
          authored = { parseError: String(error && error.message) };
        }
        const mode = authored?.mode ?? manifest().mode ?? "edit";
        settingsParsed = {
          mode,
          editable: mode === "edit" && (authored?.editable ?? true),
          toolbar: mode !== "view" && (authored?.toolbar ?? true),
          saveThresholdBytes: authored?.saveThresholdBytes ?? 2 * 1024 * 1024,
          /* Behaviour, so it lives in the settings block; the manifest's copy is the
             fallback for a document saved before the move. */
          timeoutMs: Number(authored?.timeoutMs ?? manifest().timeoutMs) || 8000,
          /* The save choice travels unnormalised: a preset name, or the explicit
             per-asset map that replaces it once anything is overridden. */

          assets: authored?.assets ?? null,

        return Object.assign({ kind, id, message }, extra || {});

        const controller = new AbortController();

          clearTimeout(timer);
        }

        if (!response.ok) {
          throw failure("http", asset.id, `HTTP ${response.status}`, { url: asset.url, status: response.status });
        }

        const bytes = await response.arrayBuffer();
        const actual = await sha384(bytes);
        if (asset.integrity && actual !== asset.integrity) {
          throw failure("integrity", asset.id, "hash does not match the manifest", {
            url: asset.url,
            expected: asset.integrity,
            actual,
          });
        }

        return { text: new TextDecoder().decode(bytes) };
      }

      /* Evaluate verified bytes. Side effects stay here, never in the fetch, so the
         load phase can run in parallel without reordering anything. */
      async function evaluate(asset, text) {
        if (asset.kind === "css") return { css: text };
        if (asset.kind === "html") return { html: text };
        const blob = URL.createObjectURL(new Blob([text], { type: "text/javascript" }));
        let namespace;
        try {
          namespace = await import(blob);
        } catch (error) {
          throw failure("import", asset.id, error && error.message ? error.message : "module failed to evaluate", { url: asset.url });
        }
        const factory = namespace[asset.factory];
        if (typeof factory !== "function") {
          throw failure("import", asset.id, `module does not export ${asset.factory}`, { url: asset.url });
        }
        return { factory };
      }

      async function fetchAsset(asset) {
        if (factories[asset.id]) return { factory: factories[asset.id] };
        if (asset.mode !== "online") {
          throw failure("missing", asset.id, `not loaded, and its mode is "${asset.mode}"`);
        }
        const { text } = await fetchVerified(asset);
        return evaluate(asset, text);
      }

      /* Verified CDN text for an asset, which is what a saved document embeds when a
         policy decides to inline an asset that was loaded by reference. Cached: the
         bytes at a pinned url + hash cannot change. An inline asset does not need
         this — its text is already the block in the document. */
      async function source(id) {
        if (sources[id] != null) return sources[id];
        const asset = manifest().assets.find((candidate) => candidate.id === id);
        if (!asset) throw failure("missing", id, "is not in the manifest");
        if (asset.mode === "inline") {
          throw failure("missing", id, "is inline, so its text is the block in this document, not a CDN file");
        }
        const { text } = await fetchVerified(asset);
        sources[id] = text;
        return text;
      }

      /**
       * Put a fetched fragment where its manifest entry says. Chrome goes in front of
       * `#viewport` because the body is a flex column and its position is the layout;
       * a plugin fragment can name its own host with `append:<selector>`.
       */
      function insertFragment(asset, markup) {
        const instruction = asset.insert || "before:#viewport";
        const split = instruction.indexOf(":");
        const place = split < 0 ? "before" : instruction.slice(0, split);
        const selector = split < 0 ? instruction : instruction.slice(split + 1);
        const anchor = document.querySelector(selector);

        /* A fragment is published as its *body*, so the element has to be rebuilt from
           the open tag the manifest carries. That is what keeps a fetched fragment
           identical to the inline one. */
        const open = asset.open || "<div>";
        const tag = (/^<([a-zA-Z][\w-]*)/.exec(open) || [null, "div"])[1];
        const template = document.createElement("template");
        template.innerHTML = `${open}${markup}</${tag}>`;
        const nodes = template.content;
        /* Tag the roots: a fetched fragment is session state, and the save path has to be
           able to tell it from a block that belongs to the file. */
        for (const node of nodes.children) node.setAttribute("data-asset", asset.id);
        if (place === "append" && anchor) anchor.append(nodes);
        else if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(nodes, anchor);
        else document.body.append(nodes);
      }

      async function boot() {
        if (state !== "declared") return modules;
        setState("booting");
        errors.length = 0;

        const mode = settings().mode;
        const assets = manifest()
          .assets.filter((asset) => inMode(asset, mode))
          .sort((a, b) => a.order - b.order);
        const jsAssets = assets.filter((asset) => asset.kind === "js" && asset.role !== "infra");
        emit("start", { order: jsAssets.map((asset) => asset.id), total: jsAssets.length });

        /* 1. Load in parallel: I/O is order-free. */
        const online = assets.filter((asset) => asset.mode === "online");
        const loaded = new Map();
        const outcomes = await Promise.allSettled(
          online.map(async (asset) => {
            loaded.set(asset.id, await fetchAsset(asset));
          }),
        );
        for (const [i, outcome] of outcomes.entries()) {
          if (outcome.status === "rejected") return fail(outcome.reason);
        }

        /* 2. Construct in order: side effects are order-bound. */
        let index = 0;
        for (const asset of assets) {
          if (asset.role === "infra" && asset.kind === "js") continue; /* already running */

          /* Fragments and stylesheets are not modules. An inline fragment is already in
             the document (that is the point of shipping markup); a fetched one is
             inserted here, in manifest order, before anything that reads it. */
          if (asset.kind === "html") {
            const fetched = loaded.get(asset.id);
            if (fetched?.html != null) insertFragment(asset, fetched.html);
            continue;
          }

          /* Stylesheets are not modules: inline ones are already in the document,
             online ones are injected here, in manifest order, so cascade order is
             the same in both flavours. */
          if (asset.kind === "css") {
            const result = loaded.get(asset.id);
            if (result?.css != null) {
              const style = document.createElement("style");
              style.textContent = result.css;
              style.dataset.asset = asset.id;
              document.head.append(style);
              injected.push(style);
            }
            continue;
          }

          const position = index++;
          emit("construct", { id: asset.id, state: "active", index: position, total: jsAssets.length });

          const deps = { env: globalThis, settings: settings(), late, optional };
          for (const name of asset.deps || []) {
            if (!(name in modules)) {
              return fail(failure("construct", asset.id, `requires "${name}", which is not built`));
            }
            deps[name] = modules[name];
          }

          const factory = factories[asset.id] || loaded.get(asset.id)?.factory;
          if (!factory) {
            return fail(
              failure(
                "missing",
                asset.id,
                asset.mode === "inline" ? "not loaded (its block is missing from this document)" : "not loaded from the CDN",
              ),
            );
          }

          try {
            modules[asset.id] = factory(deps);
          } catch (error) {
            return fail(
              failure("construct", asset.id, error && error.message ? error.message : String(error), {
                stack: error && error.stack ? String(error.stack) : null,
              }),
            );
          }

          /* No global is published: the manifest's dependency list is the only way
             one module reaches another, and boot injects it. */
          emit("construct", { id: asset.id, state: "ok", index: position, total: jsAssets.length });
        }

        setState("ready");
        emit("ready", { count: Object.keys(modules).length });
        return modules;
      }

      /* Tear the graph down and build it again. Registered factories survive, so a
         failure that was environmental can be retried without reloading the file. */
      async function retry() {
        if (state === "booting") return modules;
        for (const id of Object.keys(modules)) delete modules[id];
        for (const node of injected.splice(0)) node.remove();
        for (const id of Object.keys(sources)) delete sources[id];
        errors.length = 0;
        setState("declared");
        return boot();
      }

      return {
        register,
        on,
        late,
        settings,
        optional,
        source,
        boot,
        retry,
        order,
        manifest,
        modules,
        factories,
        errors,
        get state() {
          return state;
        },
      };
    })();
  </script>

<!-- @asset id="boot-ui" kind="js" order="6" -->
  <script id="boot-ui">
    /* The boot shell. Owns no state: it subscribes to the registry's events and
       renders them. Loaded before any asset, so it may not depend on core CSS, and
       it resolves the dialog lazily so markup order cannot break it. */
    (function () {
      "use strict";

      const registry = globalThis.StandaloneDoc;
      const SHOW_DELAY = 150; /* a card that flashes for 60ms is worse than none */

      /* Presentation only: registration ids are technical. */
      const LABELS = {
        signals: "Signals",
        zoom: "Zoom",
        pagination: "Pagination",
        status: "Status line",
        editor: "Editor",
        figures: "Figures",
        toolbar: "Toolbar",
        progress: "Progress dialog",
        export: "Export",
      };
      const label = (id) => LABELS[id] || id.charAt(0).toUpperCase() + id.slice(1);

      let ui = null;
      let showTimer = null;
      let lastStart = {order: [], total: 0};
      const failures = [];

      function ensure() {
        if (ui) return ui;
        const dialog = document.getElementById("boot-dialog");
        if (!dialog) return null;
        ui = {
          dialog,
          title: dialog.querySelector("[data-boot-title]"),
          sub: dialog.querySelector("[data-boot-sub]"),
          bar: dialog.querySelector("[data-boot-bar]"),
          fill: dialog.querySelector("[data-boot-fill]"),
          rows: dialog.querySelector("[data-boot-rows]"),
          error: dialog.querySelector("[data-boot-error]"),
          errorTitle: dialog.querySelector("[data-boot-error-title]"),
          errorBody: dialog.querySelector("[data-boot-error-body]"),
          diag: dialog.querySelector("[data-boot-diag]"),
          retry: dialog.querySelector("[data-boot-retry]"),
          copy: dialog.querySelector("[data-boot-copy]"),
          toggle: dialog.querySelector("[data-boot-toggle]"),
        };
        wire(ui);
        return ui;
      }

      function setBar(fraction) {
        const el = ensure();
        if (!el) return;
        el.fill.style.transform = `scaleX(${Math.max(0, Math.min(1, fraction)).toFixed(3)})`;
        const pct = Math.round(fraction * 100);
        el.bar.setAttribute("aria-valuenow", String(pct));
        el.bar.setAttribute("aria-valuetext", el.sub.textContent || `${pct}%`);
      }

      function open() {
        const el = ensure();
        if (!el || el.dialog.open) return;
        el.dialog.showModal();
      }

      function scheduleOpen() {
        clearTimeout(showTimer);
        showTimer = setTimeout(open, SHOW_DELAY);
      }

      function close() {
        clearTimeout(showTimer);
        const el = ensure();
        if (el?.dialog.open) el.dialog.close();
      }

      function renderRows(order) {
        const el = ensure();
        if (!el) return;
        el.rows.replaceChildren();
        for (const id of order) {
          const row = document.createElement("li");
          row.className = "boot-row";
          row.dataset.state = "pending";
          row.dataset.id = id;
          row.innerHTML = '<span class="boot-dot" aria-hidden="true"></span><span class="boot-name"></span><span class="boot-detail"></span>';
          row.querySelector(".boot-name").textContent = label(id);
          el.rows.append(row);
        }
      }

      function reset() {
        const el = ensure();
        failures.length = 0;
        if (!el) return;
        el.error.hidden = true;
        el.retry.hidden = true;
        el.toggle.hidden = true;
        el.diag.hidden = true;
        el.diag.textContent = "";
        el.dialog.dataset.phase = "booting";
        el.title.textContent = "Starting the editor";
        el.sub.textContent = "";
        setBar(0);
      }

      function diagnosticsText() {
        const el = ensure();
        const lines = [
          "standalone-doc boot",
          `state:    ${registry.state}`,
          `document: ${location.href}`,
          `modules:  ${(lastStart.order || []).join(", ") || "—"}`,
          "",
        ];
        for (const failure of failures) {
          lines.push(`[${failure.kind || failure.phase}] ${failure.id}: ${failure.message}`);
          if (failure.url) lines.push(`url: ${failure.url}`);
          if (failure.expected) lines.push(`expected ${failure.expected}`, `actual   ${failure.actual}`);
          if (failure.stack) lines.push(failure.stack);
          lines.push("");
        }
        lines.push(`user agent: ${navigator.userAgent}`);
        return lines.join("\n");
      }

      /* One card per failure mode: the copy is the product here. */
      function copyFor(failure) {
        const name = label(failure.id);
        switch (failure.kind) {
          case "offline":
            return { title: "You appear to be offline", body: `${name} could not be downloaded. Reconnect, then retry — nothing has been changed.` };
          case "unreachable":
            return { title: "The CDN is unreachable", body: `${name} could not be downloaded. Your connection is working, so this is usually temporary or a proxy blocking the CDN.` };
          case "http":
            return { title: "An asset is missing from the CDN", body: `${name} returned HTTP ${failure.status}. This document pins one runtime version; that file was not published at it.` };
          case "timeout":
            return { title: "Loading timed out", body: `${name} did not finish downloading in time. Slow connections usually succeed on retry.` };
          case "integrity":
            return { title: "This document's code has been altered", body: `The bytes served for ${name} do not match the hash recorded when this document was saved. It was not run.` };
          case "import":
            return { title: "A module could not start", body: `${name} downloaded but failed to evaluate.` };
          case "missing":
            return { title: "An asset is not loaded", body: `${name}: ${failure.message}` };
          default:
            /* Never lose the actual message: it is the actionable part. */
            return { title: "The editor failed to start", body: `${name} threw while starting: ${failure.message}` };
        }
      }

      function renderFailure(failure) {
        const el = ensure();
        if (!el) return;
        failures.push(failure);
        const copy = copyFor(failure);
        el.dialog.dataset.phase = "failed";
        el.title.textContent = copy.title;
        el.sub.textContent = "Aborted — nothing has been changed on disk";
        /* Mark the row that failed: the registry emits "active" and then aborts, so
           without this the last row would sit on "starting…" forever. */
        const failedRow = el.rows.querySelector(`.boot-row[data-id="${failure.id}"]`);
        if (failedRow) {
          failedRow.dataset.state = "failed";
          failedRow.querySelector(".boot-detail").textContent = "failed";
        }
        el.error.hidden = false;
        el.errorTitle.textContent = label(failure.id);
        el.errorBody.textContent = copy.body;
        el.diag.textContent = diagnosticsText();
        el.retry.hidden = false;
        el.toggle.hidden = false;
        el.copy.hidden = false;
        /* Errors are never delayed: the faster they appear, the less it feels hung. */
        clearTimeout(showTimer);
        open();
        el.retry.focus();
      }

      function wire(el) {
        el.dialog.addEventListener("cancel", (event) => event.preventDefault());

        el.retry.addEventListener("click", () => {
          reset();
          open();
          try {
            registry.retry();
          } catch {
            /* retry() re-emits "failed", which renders the card again. */
          }
        });

        el.toggle.addEventListener("click", () => {
          const opening = el.diag.hidden;
          el.diag.hidden = !opening;
          el.toggle.textContent = opening ? "Hide diagnostics" : "Diagnostics";
        });

        el.copy.addEventListener("click", async () => {
          const text = diagnosticsText();
          try {
            await navigator.clipboard.writeText(text);
            el.copy.textContent = "Copied";
          } catch {
            el.diag.hidden = false;
            el.diag.textContent = text;
            el.copy.textContent = "Select and copy";
          }
          setTimeout(() => (el.copy.textContent = "Copy diagnostics"), 1400);
        });
      }

      /* Never leave the document hidden forever: if boot never settles (a broken
         registry block, a parse error), reveal it and say so. */
      setTimeout(() => {
        if (document.documentElement.dataset.bootState !== "booting") return;
        document.documentElement.dataset.bootState = "failed";
        const el = ensure();
        if (!el) return;
        el.dialog.dataset.phase = "failed";
        el.title.textContent = "The editor did not start";
        el.sub.textContent = "Nothing has been changed on disk";
        el.error.hidden = false;
        el.errorTitle.textContent = "Boot never finished";
        el.errorBody.textContent = "The runtime did not report ready or failed. Copy the diagnostics and send them to the author.";
        el.retry.hidden = false;
        el.toggle.hidden = false;
        el.copy.hidden = false;
        el.diag.textContent = diagnosticsText();
        open();
      }, 20_000);

      if (!registry) return;

      registry.on("start", (detail) => {
        lastStart = detail;
        reset();
        renderRows(detail.order);
        const el = ensure();
        if (el) {
          const assets = registry.manifest().assets || [];
          const online = assets.filter((asset) => asset.mode === "online").length;
          const version = /@([^/]+)\//.exec(registry.manifest().cdnBase || "")?.[1];
          el.sub.textContent = online
            ? `${detail.total} modules · ${online} fetched from the CDN${version ? ` · ${version}` : ""}`
            : `${detail.total} modules · everything embedded in this file`;
        }
        scheduleOpen();
      });

      registry.on("construct", (detail) => {
        const el = ensure();
        if (!el) return;
        const row = el.rows.querySelector(`.boot-row[data-id="${detail.id}"]`);
        if (row) {
          row.dataset.state = detail.state;
          row.querySelector(".boot-detail").textContent = detail.state === "ok" ? "ready" : "starting…";
        }
        const done = detail.state === "ok" ? detail.index + 1 : detail.index;
        setBar(0.95 * (done / Math.max(1, detail.total)));
      });

      registry.on("ready", (detail) => {
        const el = ensure();
        setBar(1);
        if (!el) return;
        el.dialog.dataset.phase = "ready";
        el.sub.textContent = `Ready · ${detail.count} modules`;
        close();
      });

      registry.on("failed", (detail) => renderFailure(detail.error));
    })();
  </script>
