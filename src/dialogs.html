<dialog id="shortcuts-dialog">
  <form method="dialog">
    <h2>Keyboard shortcuts</h2>
    <div id="keylist"></div>
    <div class="dialog-actions">
      <button class="primary" value="close" autofocus>Done</button>
    </div>
  </form>
</dialog>

<dialog id="progress-dialog" aria-labelledby="progress-title">
  <h2 id="progress-title" data-progress-title>Working…</h2>
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <i data-progress-bar></i>
  </div>
  <p data-progress-text aria-live="polite">Starting…</p>
  <div class="dialog-actions">
    <button type="button" data-progress-cancel>Cancel</button>
  </div>
</dialog>

<dialog id="save-policy-dialog" aria-labelledby="save-policy-title">
  <div class="sp-body">
    <h2 id="save-policy-title" data-save-title>This document is large</h2>
    <p class="sp-sub" data-save-sub>Choose what travels inside the file. Nothing is written until you save.</p>
    <div data-save-rows></div>
    <p class="sp-note" data-save-note></p>
  </div>
  <div class="dialog-actions">
    <button type="button" data-save-cancel>Cancel</button>
    <span class="spacer"></span>
    <button type="button" class="primary" data-save-confirm>Save</button>
  </div>
</dialog>
