name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: check (split/combine integrity)
    runs-on: ubuntu-latest
    steps:
      # Tags, not history, are what `check` verifies the runtime catalog against: a
      # shallow clone would silently skip that half of the gate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs check

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      # `npm run catalog` reads the tags; the unit suite exercises it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-concurrency=1 test/unit/*.test.js

  browser:
    name: browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Chromium blocks; WebKit/Firefox are advisory until they have a clean
    # streak, per the plan.
    continue-on-error: ${{ matrix.project != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            test-results
            playwright-report
          retention-days: 7

  # Still to come:
  #   size:    budgets from size-baseline.json
  #   nightly: CDN link health + sha384 verification (scheduled, non-blocking)
