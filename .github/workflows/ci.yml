name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: check (split/combine integrity)
    runs-on: ubuntu-latest
    steps:
      # Tags, not history, are what `check` verifies the runtime catalog against: a
      # shallow clone would silently skip that half of the gate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs check

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      # `npm run catalog` reads the tags; the unit suite exercises it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-concurrency=1 test/unit/*.test.js

  browser:
    name: browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Every engine blocks. The browser a reader has is the only behaviour that counts, and an
    # advisory job that can go red without failing the run is how a WebKit-only regression
    # survived five pushes (v0.8.0 → v0.8.2): the run stayed green while `browser (webkit)`
    # was red. `fail-fast: false` keeps the other two reporting when one is.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            test-results
            playwright-report
          retention-days: 7

  # The visual gate. Its baseline is generated on this runner, never committed: a page
  # screenshot resolves the font stack to whatever the platform has (Charter on macOS, a
  # metric-compatible substitute here), so one platform's picture is not another's baseline.
  # The cache is the baseline store. A cold key writes the picture and passes; a warm key
  # compares and fails on a difference. Bump VISUAL_BASELINE when a visual change is
  # intended, so the cache refreshes instead of failing forever.
  visual:
    name: visual (chromium, linux baseline)
    runs-on: ubuntu-latest
    env:
      VISUAL_BASELINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: test/browser/pagination-visual.spec.js-snapshots
          key: visual-${{ runner.os }}-chromium-v1
      # `missing` writes a cold baseline and compares a warm one; a mismatch is a failure.
      - run: VISUAL=1 npx playwright test test/browser/pagination-visual.spec.js --project=chromium --update-snapshots=missing
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual
          path: |
            test-results
            playwright-report
          retention-days: 7

  # Still to come:
  #   size:    budgets from size-baseline.json
  #   nightly: CDN link health + sha384 verification (scheduled, non-blocking)
